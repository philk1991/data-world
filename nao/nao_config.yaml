# nao project configuration — https://docs.getnao.io
#
# Scoped to the NBA mart layer only (lake.marts.nba_*) so nao's context stays
# small and focused. nao reads the DuckLake (Postgres catalog + Parquet files),
# attached READ_ONLY, so it never writes and — unlike the old single .duckdb
# file — can run alongside dbt builds, ingest jobs and Cube.
project_name: nba

databases:
  - name: lake
    type: ducklake
    # Same catalog as data-ingestion/lake.py's default (created by `task lake:init`).
    # Local Homebrew Postgres trusts the logged-in user, hence no password.
    catalog:
      type: postgres
      host: localhost
      database: data_world_lake
      user: "${{ env('USER') }}"
      password: ""
    # Absolute path with a trailing slash, exported by the Taskfile for every task.
    # DuckLake rejects any other spelling of the path the lake was created with.
    data_path: "${{ env('LAKE_DATA_PATH') }}"
    # Templates run during `nao sync` to build the context markdown per table.
    templates:
      - columns      # column names + types
      - preview      # a small sample of rows
    # Glob patterns matched against "<catalog>.<schema>.<table>". Empty =
    # everything; this keeps nao scoped to the NBA marts only.
    include:
      - "lake.marts.nba_*"
    exclude: []

repos: []

# A local model through Ollama (brew services start ollama; task nao:model builds it),
# so chat costs nothing and nothing leaves the machine. No API key needed.
# Ollama listens on localhost:11434; set OLLAMA_BASE_URL in nao/.env to change it.
# nao-core 0.3.31 also supports openai, anthropic, mistral, gemini, openrouter,
# requesty, bedrock, vertex, qwen, minimax, moonshot, meta and openaiCompatible
# (hosted ones need a key in nao/.env).
llm:
  providers:
    - provider: ollama
      models:
        - id: nao-qwen3:14b
          default: true

slack: null

# `task nao:test` (nao test) runs the questions under tests/ through the agent.
# Questions answered through Cube can't use nao's data verification (it only reads
# SQL results), so each test asserts the Cube call and records its expected answer
# in a comment; read the answers in tests/outputs/.
test:
  models:
    - ollama:nao-qwen3:14b

# nao project configuration — https://docs.getnao.io
#
# Scoped to the NBA mart layer only (lake.marts.nba_*) so nao's context stays
# small and focused. nao reads the DuckLake (Postgres catalog + Parquet files),
# attached READ_ONLY, so it never writes and — unlike the old single .duckdb
# file — can run alongside dbt builds, ingest jobs and Cube.
project_name: nba

databases:
  - name: lake
    type: ducklake
    # Same catalog as data-ingestion/lake.py's default (created by `task lake:init`).
    # Local Homebrew Postgres trusts the logged-in user, hence no password.
    catalog:
      type: postgres
      host: localhost
      database: data_world_lake
      user: "${{ env('USER') }}"
      password: ""
    # Absolute path with a trailing slash, exported by the Taskfile for every task.
    # DuckLake rejects any other spelling of the path the lake was created with.
    data_path: "${{ env('LAKE_DATA_PATH') }}"
    # Templates run during `nao sync` to build the context markdown per table.
    templates:
      - columns      # column names + types
      - preview      # a small sample of rows
    # Glob patterns matched against "<catalog>.<schema>.<table>". Empty =
    # everything; this keeps nao scoped to the eight NBA marts only.
    include:
      - "lake.marts.nba_*"
    exclude: []

repos: []

# LLM is intentionally left unset (choosing one is a separate decision).
# nao-core 0.3.25 supports openai, anthropic, mistral, gemini, openrouter,
# requesty, ollama, bedrock, vertex and qwen — ollama makes a zero-cost local
# model possible. `nao sync`/`nao debug` work without it; `nao chat` needs one:
#
#   llm:
#     provider: anthropic          # or: ollama, openai, ...
#     api_key: "${{ env('ANTHROPIC_API_KEY') }}"
#
# See nao/.env.example and the "Analytics agent (nao)" section of CLAUDE.md.
llm: null

slack: null

version: '3'

vars:
  VENV: .venv/bin/activate
  DBT_DIR: dbt
  # Homebrew's postgresql@17 is keg-only (not on PATH). Override with PG_BIN=... for other installs.
  PG_BIN:
    sh: echo "${PG_BIN:-$(brew --prefix postgresql@17 2>/dev/null)/bin}"
  LAKE_DB: data_world_lake
  CACHE: data-ingestion/.spotify_cache

tasks:

  # ── Spotify Ingestion ────────────────────────────────────────────────────────

  ingest:
    desc: Clear Spotify cache and run the full ingest pipeline
    cmds:
      - rm -f {{.CACHE}}
      - bash -c "source {{.VENV}} && cd data-ingestion && python ingest.py"

  ingest:no-cache-clear:
    desc: Run ingest without clearing the Spotify cache (uses existing token)
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python ingest.py"

  # ── dbt ─────────────────────────────────────────────────────────────────────

  dbt:run:
    desc: Run all dbt models
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt run"

  dbt:test:
    desc: Run all dbt tests
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt test"

  dbt:build:
    desc: Run all dbt models then test them
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt build"

  dbt:deps:
    desc: Install dbt packages (including elementary)
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt deps"

  dbt:elementary:init:
    desc: Materialise Elementary tracking tables in DuckDB (run once after dbt deps)
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt run --select elementary"

  edr:report:
    desc: Generate and open the Elementary observability report
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && edr report --profiles-dir . --project-dir . --open-browser true"

  dbt:docs:
    desc: Generate and serve dbt docs in the browser
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt docs generate && dbt docs serve"

  dbt:compile:
    desc: Compile dbt project (validates SQL without running)
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt compile"

  dbt:parse:
    desc: Parse dbt project and regenerate manifest.json (required after adding/renaming models)
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt parse --profiles-dir ."

  dbt:run:select:
    desc: "Run a specific dbt model -- usage: task dbt:run:select MODEL=top_tracks_enriched"
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt run --select {{.MODEL}}"
    requires:
      vars: [MODEL]

  dbt:test:select:
    desc: "Test a specific dbt model -- usage: task dbt:test:select MODEL=stg_top_tracks"
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt test --select {{.MODEL}}"
    requires:
      vars: [MODEL]

  # ── Dashboard ────────────────────────────────────────────────────────────────

  dashboard:install:
    desc: Install Spotify dashboard Node.js dependencies
    dir: dashboards/spotify
    cmds:
      - npm install

  dashboard:dev:
    desc: "Start the Spotify dashboard with hot reload (http://localhost:5173)"
    dir: dashboards/spotify
    cmds:
      - npm run dev

  dashboard:build:
    desc: Build the Spotify dashboard for production
    dir: dashboards/spotify
    cmds:
      - npm run build

  dashboard:start:
    desc: Run the built Spotify dashboard
    dir: dashboards/spotify
    cmds:
      - npm run preview

  # ── dbt Crypto ──────────────────────────────────────────────────────────────

  dbt:crypto:run:
    desc: Run all crypto dbt models (staging_crypto + OHLCV marts)
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt run --select staging.crypto+ marts.crypto+"

  dbt:crypto:test:
    desc: Run all crypto dbt tests
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt test --select staging.crypto+ marts.crypto+"

  dbt:crypto:build:
    desc: Run and test all crypto dbt models
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt build --select staging.crypto+ marts.crypto+"

  # ── Crypto Streaming ────────────────────────────────────────────────────────

  crypto:producer:
    desc: "Start the Binance WebSocket → Kafka producer (BTC/USDT, ETH/USDT)"
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python -m crypto.producer"

  crypto:consumer:
    desc: "Start the Kafka → DuckDB consumer (raw_crypto.raw_trades)"
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python -m crypto.consumer"

  # ── dbt Payments ──────────────────────────────────────────────────────────────

  dbt:payments:run:
    desc: Run all payments dbt models (staging_payments + payment marts)
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt run --select staging.payments+ marts.payments+"

  dbt:payments:test:
    desc: Run all payments dbt tests
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt test --select staging.payments+ marts.payments+"

  dbt:payments:build:
    desc: Run and test all payments dbt models
    cmds:
      - bash -c "source {{.VENV}} && cd {{.DBT_DIR}} && dbt build --select staging.payments+ marts.payments+"

  # ── Payments Streaming ──────────────────────────────────────────────────────

  payments:producer:
    desc: "Start the synthetic payments → Kafka producer (payments.requests + payments.rejected)"
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python -m payments.producer"

  payments:consumer:
    desc: "Start the Kafka → DuckDB consumer (raw_payments.raw_requests + raw_rejections)"
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python -m payments.consumer"

  # ── Setup ───────────────────────────────────────────────────────────────────

  setup:streaming-dbs:
    desc: "Create empty crypto_raw/payments_raw DuckDB files if missing (run once on a fresh clone). dbt's profile attaches both read-only on every run, and errors if they don't exist yet."
    cmds:
      - mkdir -p data
      - bash -c "source {{.VENV}} && python -c \"import duckdb; [duckdb.connect(f).close() for f in ('data/crypto_raw.duckdb', 'data/payments_raw.duckdb')]\""
    status:
      - test -f data/crypto_raw.duckdb
      - test -f data/payments_raw.duckdb

  # ── Lake (DuckLake: Postgres catalog + Parquet in data/lake/) ────────────────

  lake:init:
    desc: "Create the DuckLake catalog database (data_world_lake) and data/lake/, then attach once to initialise it. Idempotent. Requires Postgres running: brew services start postgresql@17"
    cmds:
      - mkdir -p data/lake
      - bash -c '"{{.PG_BIN}}/pg_isready" -q || { echo "Postgres is not running — brew services start postgresql@17"; exit 1; }'
      - bash -c '"{{.PG_BIN}}/psql" -d postgres -Atc "select 1 from pg_database where datname = '"'"'{{.LAKE_DB}}'"'"'" | grep -q 1 || "{{.PG_BIN}}/createdb" {{.LAKE_DB}}'
      - bash -c "source {{.VENV}} && cd data-ingestion && python -c 'from lake import connect_lake; connect_lake().close(); print(\"Lake ready.\")'"

  lake:status:
    desc: Show Postgres status and the lake's schemas, table counts, snapshot count and on-disk size
    silent: true
    cmds:
      - bash -c '"{{.PG_BIN}}/pg_isready"'
      - |
        bash -c "source {{.VENV}} && cd data-ingestion && python -c '
        from lake import connect_lake, lake_settings
        c = connect_lake(read_only=True)
        print(\"catalog:  \", lake_settings()[0])
        print(\"data path:\", lake_settings()[1])
        for schema, n in c.execute(\"select table_schema, count(*) from information_schema.tables where table_catalog = current_database() group by 1 order by 1\").fetchall():
            print(f\"  {schema:20s} {n} tables/views\")
        print(\"snapshots:\", c.execute(\"select count(*) from lake.snapshots()\").fetchone()[0])
        '"
      - bash -c 'du -sh data/lake 2>/dev/null || echo "data/lake does not exist — run task lake:init"'

  # ── Schema Migration ────────────────────────────────────────────────────────

  migrate:schemas:
    desc: Migrate existing DuckDB tables from main schema to raw_spotify / raw_statsbomb
    cmds:
      - bash -c "source {{.VENV}} && python scripts/migrate_schemas.py"

  # ── Crypto Dashboard ─────────────────────────────────────────────────────────

  dashboard:crypto:install:
    desc: Install crypto dashboard Node.js dependencies
    dir: dashboards/crypto
    cmds:
      - npm install

  dashboard:crypto:dev:
    desc: "Start the crypto dashboard with hot reload (http://localhost:5174)"
    dir: dashboards/crypto
    cmds:
      - npm run dev -- --port 5174

  dashboard:crypto:build:
    desc: Build the crypto dashboard for production
    dir: dashboards/crypto
    cmds:
      - npm run build

  # ── StatsBomb Ingestion ──────────────────────────────────────────────────────

  ingest:statsbomb:
    desc: Run the StatsBomb open data ingest pipeline (incremental)
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python ingest_statsbomb.py"

  # ── NBA Ingestion ─────────────────────────────────────────────────────────────

  ingest:nba:
    desc: Download the Kaggle NBA dataset (core + extended) and load into DuckDB
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python ingest_nba.py"

  # ── OpenF1 Ingestion ──────────────────────────────────────────────────────────

  ingest:openf1:
    desc: "Ingest the OpenF1 season (meetings, sessions + per-session laps/pit/stints/weather/drivers)"
    cmds:
      - bash -c "source {{.VENV}} && cd data-ingestion && python ingest_openf1.py"

  # ── Dagster Orchestration ────────────────────────────────────────────────────

  dagster:dev:
    desc: "Start Dagster UI + daemon (http://localhost:3000)"
    cmds:
      - bash -c "source {{.VENV}} && DAGSTER_HOME=$(pwd)/orchestration dagster dev --module-name dagster_data_world"

  dagster:install:
    desc: Install the orchestration package into the venv (run once after adding deps)
    dir: orchestration
    cmds:
      - bash -c "source ../.venv/bin/activate && pip install -e . --quiet"

  # ── Combined ─────────────────────────────────────────────────────────────────

  refresh:
    desc: Full refresh — ingest from Spotify then build and test all dbt models
    cmds:
      - task: ingest
      - task: dbt:build

  refresh:statsbomb:
    desc: Ingest StatsBomb data then build and test all dbt models
    cmds:
      - task: ingest:statsbomb
      - task: dbt:build

  refresh:nba:
    desc: Ingest NBA data then build and test all dbt models
    cmds:
      - task: ingest:nba
      - task: dbt:build

  refresh:openf1:
    desc: Ingest OpenF1 data then build and test all dbt models
    cmds:
      - task: ingest:openf1
      - task: dbt:build

  refresh:payments:
    desc: Build and test payments dbt models only (payments has no one-shot ingest task -- run task payments:producer / task payments:consumer separately to land raw data first)
    cmds:
      - task: dbt:payments:build

  refresh:all:
    desc: Full refresh of all sources — Spotify + StatsBomb + NBA — then build all dbt models
    cmds:
      - task: ingest
      - task: ingest:statsbomb
      - task: ingest:nba
      - task: dbt:build

  # ── Cube (semantic layer) ────────────────────────────────────────────────────

  cube:install:
    desc: Install Cube semantic layer Node.js dependencies
    dir: cube
    cmds:
      - npm install

  cube:dev:
    desc: "Start the Cube dev server + Playground (http://localhost:4000). Don't run alongside task dbt:run or the Dagster spotify/nba ingest jobs — the DuckDB driver always opens spotify.duckdb read-write."
    dir: cube
    cmds:
      - npm run dev

  # ── nao (analytics agent) ─────────────────────────────────────────────────────

  nao:install:
    desc: "Create nao's isolated venv and install nao-core. Kept separate from .venv on purpose — nao-core pulls protobuf 7, which conflicts with dbt/dagster in the shared venv."
    cmds:
      - python3.12 -m venv nao/.venv
      - nao/.venv/bin/pip install --upgrade pip --quiet
      - nao/.venv/bin/pip install nao-core

  nao:sync:
    desc: "Refresh nao's context from the DuckDB marts (writes nao/databases/**). Reads marts.nba_* — don't run alongside task cube:dev, task dbt:run, or the Dagster NBA ingest, which hold a read-write lock on spotify.duckdb."
    dir: nao
    cmds:
      - .venv/bin/nao sync

  nao:debug:
    desc: "Validate nao config and test the DuckDB connection (LLM check runs only if a provider is set). Same DuckDB lock caveat as nao:sync."
    dir: nao
    cmds:
      - .venv/bin/nao debug

  nao:dev:
    desc: "Start the nao chat UI (http://localhost:5005). Requires an LLM provider in nao_config.yaml — none set by default (see CLAUDE.md). Opens spotify.duckdb READ-ONLY; still don't run alongside a read-write holder (task cube:dev / task dbt:run / Dagster NBA ingest)."
    dir: nao
    cmds:
      - .venv/bin/nao chat

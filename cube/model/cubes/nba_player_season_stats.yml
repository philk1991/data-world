cubes:
  - name: nba_player_season_stats
    sql_table: marts.nba_player_season_stats
    description: >
      One row per player per season per game type (Regular Season, Playoffs,
      etc.) of traditional box score totals, per-game averages and shooting
      splits, enriched with bio. Season comes from the game id. A
      player traded mid-season is combined into one row per game type, with
      primary_team_id set to the team they played the most games for. Only
      games actually played count. Splitting by game_type lets visualisations
      compare regular-season and playoff production. Stats the league did not
      record yet (steals and blocks before 1973-74, turnovers before ~1977-78,
      attempts in some early seasons) are null, and the per-game and
      percentage measures only count seasons where their inputs were recorded.
      Joined to nba_team_dim on primary_team_id for team names, and to
      nba_players_dim on person_id for biography and per-season age.

    joins:
      - name: nba_team_dim
        sql: "{CUBE}.primary_team_id = {nba_team_dim}.team_id"
        relationship: many_to_one

      - name: nba_players_dim
        sql: "{CUBE}.person_id = {nba_players_dim}.person_id"
        relationship: many_to_one

    dimensions:
      - name: person_id
        sql: person_id
        type: number
        primary_key: true
        description: NBA player identifier.

      - name: first_name
        sql: first_name
        type: string
        description: Player first name. Missing for a couple of historical players.

      - name: last_name
        sql: last_name
        type: string
        description: Player last name. Missing for a couple of historical players.

      - name: player_name
        sql: "{CUBE}.first_name || ' ' || {CUBE}.last_name"
        type: string
        description: Player full name (first and last name).

      - name: season_start_year
        sql: season_start_year
        type: number
        primary_key: true
        public: true
        description: >
          Calendar year the season started (e.g. 2023 for 2023-24), decoded from
          the game id. Follows the league's own season assignment, so the 2020
          bubble games belong to 2019-20 and the July 2021 Finals to 2020-21.

      - name: season_label
        sql: season_label
        type: string
        description: Human-readable season label (e.g. "2023-24").

      - name: game_type
        sql: game_type
        type: string
        primary_key: true
        public: true
        description: >
          Type of game, decoded from the game id: Regular Season, Playoffs,
          Play-in Tournament, Preseason, All-Star Game or NBA Cup Final. NBA Cup
          group and knockout games are Regular Season; only the Cup final, which
          does not count toward the standings, is separate. The totals cover
          games of this type.

      - name: age
        sql: "DATE_SUB('year', {nba_players_dim.birth_date}, MAKE_DATE({CUBE}.season_start_year::INTEGER + 1, 2, 1))"
        type: number
        description: >
          Player's age in completed years on 1 February of the season (e.g.
          1 Feb 2024 for 2023-24), the Basketball-Reference convention. Null when
          the birth date is unknown (about a fifth of players).

      - name: primary_team_id
        sql: primary_team_id
        type: number
        description: Team the player played the most games for that season. Null for old seasons where team ids were not recorded.

      - name: team_games_played
        sql: team_games_played
        type: number
        description: >
          Games of this type the player's primary team played that season, so
          games_played can be read as a share of the games available. Falls back
          to the most games any team played when primary_team_id is null.
          Differs from 82 in short or uneven seasons (1998-99: 50, 2011-12: 66,
          2019-20: 64-75, 2020-21: 72). Null for All-Star games before 2025-26,
          which have no team box scores.

      - name: is_qualified
        sql: is_qualified
        type: boolean
        description: >
          True when the player appeared in at least 70% of team_games_played,
          the NBA's 58-of-82 per-game minimum scaled to the games the team
          actually played. Use it for per-game leaderboards instead of a fixed
          games threshold, which is biased in short seasons. Null outside the
          Regular Season.

    segments:
      - name: qualified
        sql: "{CUBE}.is_qualified"
        description: >
          Players who meet the per-game minimum (70% of team games, Regular
          Season only). Apply this for per-game and percentage leaderboards
          instead of a fixed games-played filter.

    measures:
      - name: count
        type: count
        description: Number of player-season-game_type rows.

      - name: count_players
        sql: person_id
        type: count_distinct
        description: Number of distinct players across matching rows (a player with Regular Season and Playoffs rows counts once).

      - name: sum_games_played
        sql: games_played
        type: sum
        description: Total games played across matching rows.

      - name: sum_total_points
        sql: total_points
        type: sum
        description: Total points scored across matching rows.

      - name: max_total_points
        sql: total_points
        type: max
        description: Highest single-season point total among matching rows.

      - name: sum_total_rebounds
        sql: total_rebounds
        type: sum
        description: Total rebounds across matching rows.

      - name: sum_total_assists
        sql: total_assists
        type: sum
        description: Total assists across matching rows.

      - name: sum_total_steals
        sql: total_steals
        type: sum
        description: Total steals across matching rows.

      - name: sum_total_blocks
        sql: total_blocks
        type: sum
        description: Total blocks across matching rows.

      - name: sum_total_turnovers
        sql: total_turnovers
        type: sum
        description: Total turnovers across matching rows.

      - name: sum_field_goals_made
        sql: total_field_goals_made
        type: sum
        description: Total field goals made (in games with recorded attempts) across matching rows.

      - name: sum_field_goals_attempted
        sql: total_field_goals_attempted
        type: sum
        description: Total field goals attempted across matching rows.

      - name: sum_three_pointers_made
        sql: total_three_pointers_made
        type: sum
        description: Total three pointers made (in games with recorded attempts) across matching rows.

      - name: sum_three_pointers_attempted
        sql: total_three_pointers_attempted
        type: sum
        description: Total three pointers attempted across matching rows.

      - name: sum_free_throws_made
        sql: total_free_throws_made
        type: sum
        description: Total free throws made (in games with recorded attempts) across matching rows.

      - name: sum_free_throws_attempted
        sql: total_free_throws_attempted
        type: sum
        description: Total free throws attempted across matching rows.

      - name: points_per_game
        sql: "{sum_total_points} * 1.0 / NULLIF({sum_games_played}, 0)"
        type: number
        description: Points per game across matching rows — total points over total games, so high-volume seasons weigh more.

      - name: rebounds_per_game
        sql: "SUM({CUBE}.total_rebounds) * 1.0 / NULLIF(SUM(CASE WHEN {CUBE}.total_rebounds IS NOT NULL THEN {CUBE}.games_played END), 0)"
        type: number
        description: Rebounds per game across matching rows, counting only seasons where rebounds were recorded.

      - name: assists_per_game
        sql: "SUM({CUBE}.total_assists) * 1.0 / NULLIF(SUM(CASE WHEN {CUBE}.total_assists IS NOT NULL THEN {CUBE}.games_played END), 0)"
        type: number
        description: Assists per game across matching rows, counting only seasons where assists were recorded.

      - name: steals_per_game
        sql: "SUM({CUBE}.total_steals) * 1.0 / NULLIF(SUM(CASE WHEN {CUBE}.total_steals IS NOT NULL THEN {CUBE}.games_played END), 0)"
        type: number
        description: Steals per game across matching rows, counting only seasons where steals were recorded.

      - name: blocks_per_game
        sql: "SUM({CUBE}.total_blocks) * 1.0 / NULLIF(SUM(CASE WHEN {CUBE}.total_blocks IS NOT NULL THEN {CUBE}.games_played END), 0)"
        type: number
        description: Blocks per game across matching rows, counting only seasons where blocks were recorded.

      - name: turnovers_per_game
        sql: "SUM({CUBE}.total_turnovers) * 1.0 / NULLIF(SUM(CASE WHEN {CUBE}.total_turnovers IS NOT NULL THEN {CUBE}.games_played END), 0)"
        type: number
        description: Turnovers per game across matching rows, counting only seasons where turnovers were recorded.

      - name: max_points_per_game
        sql: points_per_game
        type: max
        description: Highest single-season points-per-game average among matching rows.

      - name: max_rebounds_per_game
        sql: rebounds_per_game
        type: max
        description: Highest single-season rebounds-per-game average among matching rows.

      - name: max_assists_per_game
        sql: assists_per_game
        type: max
        description: Highest single-season assists-per-game average among matching rows.

      - name: field_goal_pct
        sql: "{sum_field_goals_made} * 1.0 / NULLIF({sum_field_goals_attempted}, 0)"
        type: number
        description: Field goal percentage across matching rows — total made over total attempted, 0-1.

      - name: three_point_pct
        sql: "{sum_three_pointers_made} * 1.0 / NULLIF({sum_three_pointers_attempted}, 0)"
        type: number
        description: Three point percentage across matching rows — total made over total attempted, 0-1.

      - name: free_throw_pct
        sql: "{sum_free_throws_made} * 1.0 / NULLIF({sum_free_throws_attempted}, 0)"
        type: number
        description: Free throw percentage across matching rows — total made over total attempted, 0-1.

      - name: three_point_attempt_rate
        sql: "SUM({CUBE}.total_three_pointers_attempted) * 1.0 / NULLIF(SUM(CASE WHEN {CUBE}.total_three_pointers_attempted IS NOT NULL THEN {CUBE}.total_field_goals_attempted END), 0)"
        type: number
        description: Share of field goal attempts taken from three across matching rows, 0-1.

      - name: effective_field_goal_pct
        sql: "(SUM({CUBE}.total_field_goals_made) + 0.5 * COALESCE(SUM({CUBE}.total_three_pointers_made), 0)) / NULLIF(SUM({CUBE}.total_field_goals_attempted), 0)"
        type: number
        description: Field goal percentage adjusted for the extra value of a three, (FGM + 0.5 × 3PM) / FGA, 0-1.

      - name: true_shooting_pct
        sql: "SUM(CASE WHEN {CUBE}.total_field_goals_attempted IS NOT NULL AND {CUBE}.total_free_throws_attempted IS NOT NULL THEN {CUBE}.total_points END) / NULLIF(2 * (SUM(CASE WHEN {CUBE}.total_free_throws_attempted IS NOT NULL THEN {CUBE}.total_field_goals_attempted END) + 0.44 * SUM(CASE WHEN {CUBE}.total_field_goals_attempted IS NOT NULL THEN {CUBE}.total_free_throws_attempted END)), 0)"
        type: number
        description: Shooting efficiency accounting for twos, threes and free throws, PTS / (2 × (FGA + 0.44 × FTA)), 0-1.

      - name: assist_to_turnover_ratio
        sql: "SUM(CASE WHEN {CUBE}.total_turnovers IS NOT NULL THEN {CUBE}.total_assists END) * 1.0 / NULLIF(SUM({CUBE}.total_turnovers), 0)"
        type: number
        description: Assists per turnover across matching rows, counting only seasons where turnovers were recorded.

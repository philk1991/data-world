cubes:
  - name: nba_game_results
    sql_table: marts.nba_game_results
    description: >
      One row per NBA game combining game metadata and result with both teams'
      traditional box score lines, pivoted onto a home/away axis. Box score
      columns are null for games where the league did not record that stat yet
      (field goal attempts before ~1983, turnovers before ~1986, points in the
      paint before ~1997), so box score measures only reflect games where it
      was recorded. For one team's record across home and away games, use
      nba_team_season_summary instead.

    dimensions:
      - name: game_id
        sql: game_id
        type: number
        primary_key: true
        description: Unique NBA game identifier.

      - name: game_date
        sql: game_date
        type: time
        description: Calendar date of the game.

      - name: season_start_year
        sql: season_start_year
        type: number
        description: Calendar year the season started (e.g. 2023 for 2023-24). Season comes from the game id, the league's own season assignment, so the 2020 bubble games belong to 2019-20 and the July 2021 Finals to 2020-21.

      - name: season_label
        sql: "{season_start_year}::VARCHAR || '-' || RIGHT(({season_start_year} + 1)::VARCHAR, 2)"
        type: string
        description: Human-readable season label (e.g. "2023-24").

      - name: game_type
        sql: game_type
        type: string
        description: Type of game (Regular Season, Playoffs, etc.).

      - name: home_team_id
        sql: home_team_id
        type: number
        description: Team id of the home side.

      - name: home_team_name
        sql: home_team_name
        type: string
        description: Name of the home team.

      - name: away_team_id
        sql: away_team_id
        type: number
        description: Team id of the away side.

      - name: away_team_name
        sql: away_team_name
        type: string
        description: Name of the away team.

      - name: arena_name
        sql: arena_name
        type: string
        description: Name of the arena the game was played in.

      - name: home_team_won
        sql: home_team_won
        type: boolean
        description: True when the home team won.

      - name: is_neutral_site
        sql: is_neutral_site
        type: boolean
        description: >
          True for games with no real home court: the 2020 Orlando bubble,
          NBA Cup semifinals and finals in Las Vegas, and All-Star games. Home
          and away labels on these games are nominal. International regular
          season games are not flagged.

    segments:
      - name: home_court_games
        sql: "NOT {CUBE}.is_neutral_site"
        description: >
          Games played at a real home arena. Apply this for home-advantage
          questions (home_win_rate, home vs away scoring) so bubble and
          Las Vegas games don't dilute the result.

    measures:
      - name: count
        type: count
        description: Number of games.

      - name: avg_point_margin
        sql: point_margin
        type: avg
        description: Average home score minus away score. Positive favours the home team.

      - name: avg_abs_point_margin
        sql: "ABS({CUBE}.point_margin)"
        type: avg
        description: Average winning margin regardless of side across matching games — lower means more competitive games.

      - name: max_abs_point_margin
        sql: "ABS({CUBE}.point_margin)"
        type: max
        description: Largest winning margin among matching games.

      - name: avg_home_score
        sql: home_score
        type: avg
        description: Average final points scored by the home team.

      - name: avg_away_score
        sql: away_score
        type: avg
        description: Average final points scored by the away team.

      - name: avg_total_points
        sql: "{CUBE}.home_score + {CUBE}.away_score"
        type: avg
        description: Average combined points scored by both teams across matching games.

      - name: max_total_points
        sql: "{CUBE}.home_score + {CUBE}.away_score"
        type: max
        description: Highest combined points scored by both teams among matching games.

      - name: home_win_rate
        sql: "CASE WHEN {CUBE}.home_team_won THEN 1.0 ELSE 0.0 END"
        type: avg
        description: Share of games in this slice won by the home team.

      - name: close_game_rate
        sql: "CASE WHEN ABS({CUBE}.point_margin) <= 5 THEN 1.0 ELSE 0.0 END"
        type: avg
        description: Share of games in this slice decided by 5 points or fewer.

      - name: blowout_rate
        sql: "CASE WHEN ABS({CUBE}.point_margin) >= 20 THEN 1.0 ELSE 0.0 END"
        type: avg
        description: Share of games in this slice decided by 20 points or more.

      - name: home_field_goal_pct
        sql: "SUM(CASE WHEN {CUBE}.home_field_goals_attempted IS NOT NULL THEN {CUBE}.home_field_goals_made END) * 1.0 / NULLIF(SUM({CUBE}.home_field_goals_attempted), 0)"
        type: number
        description: Home teams' field goal percentage across matching games with recorded attempts — total made over total attempted, 0-1.

      - name: away_field_goal_pct
        sql: "SUM(CASE WHEN {CUBE}.away_field_goals_attempted IS NOT NULL THEN {CUBE}.away_field_goals_made END) * 1.0 / NULLIF(SUM({CUBE}.away_field_goals_attempted), 0)"
        type: number
        description: Away teams' field goal percentage across matching games with recorded attempts — total made over total attempted, 0-1.

      - name: avg_three_pointers_made_per_team
        sql: "({CUBE}.home_three_pointers_made + {CUBE}.away_three_pointers_made) / 2.0"
        type: avg
        description: Average three pointers made per team per game across matching games (from 1979-80, when the line was introduced).

      - name: avg_home_assists
        sql: home_assists
        type: avg
        description: Average assists by the home team across matching games.

      - name: avg_away_assists
        sql: away_assists
        type: avg
        description: Average assists by the away team across matching games.

      - name: avg_home_rebounds
        sql: home_rebounds_total
        type: avg
        description: Average total rebounds by the home team across matching games.

      - name: avg_away_rebounds
        sql: away_rebounds_total
        type: avg
        description: Average total rebounds by the away team across matching games.

      - name: avg_home_turnovers
        sql: home_turnovers
        type: avg
        description: Average turnovers by the home team across matching games.

      - name: avg_away_turnovers
        sql: away_turnovers
        type: avg
        description: Average turnovers by the away team across matching games.

      - name: avg_home_points_in_the_paint
        sql: home_points_in_the_paint
        type: avg
        description: Average points in the paint by the home team across matching games.

      - name: avg_away_points_in_the_paint
        sql: away_points_in_the_paint
        type: avg
        description: Average points in the paint by the away team across matching games.

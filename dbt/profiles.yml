spotify:
  target: dev
  outputs:
    dev:
      type: duckdb
      # In-memory session; models and sources live in the DuckLake declared in
      # catalogs.yml (attached as `lake` and used as the default database).
      path: ":memory:"
      threads: 4
      # The lake needs both extensions, which dbt v2's bundled DuckDB driver can't
      # load — install the driver once with `task dbt:driver`.
      extensions: [ducklake, postgres]
      # Concurrent writers (ingest + dbt threads) make DuckLake commits race and retry.
      # The default (10 retries, ~11s) gives up under load; this allows ~1 min.
      # Keep in step with data-ingestion/lake.py.
      settings:
        ducklake_max_retry_count: 50
        ducklake_retry_wait_ms: 50
        ducklake_retry_backoff: 1.1
      attach:
        - path: ../data/crypto_raw.duckdb
          alias: crypto_raw
          read_only: true
        - path: ../data/payments_raw.duckdb
          alias: payments_raw
          read_only: true

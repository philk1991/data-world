version: 2

unit_tests:
  - name: nba_game_results_pivots_team_box_scores
    model: nba_game_results
    description: >
      Asserts that the two team box score rows per game are pivoted onto the
      home/away axis by is_home, and that point_margin is home minus away.
      Covers: a home win, an away win (negative margin), a stat the league did
      not record for one side staying null rather than borrowing the other
      side's value, and a game with no team box rows keeping its game row with
      null stats (the LEFT JOIN).
    given:
      - input: ref('stg_nba_games')
        rows:
          # home win 110-100
          - {game_id: 1, game_date: 2024-01-10, home_team_id: 10, away_team_id: 20, home_score: 110, away_score: 100, home_team_won: true}
          # away win 95-102 -> negative margin
          - {game_id: 2, game_date: 2024-01-11, home_team_id: 30, away_team_id: 40, home_score: 95, away_score: 102, home_team_won: false}
          # older game with no team box rows
          - {game_id: 3, game_date: 1985-01-12, home_team_id: 50, away_team_id: 60, home_score: 99, away_score: 98, home_team_won: true}
      - input: ref('stg_nba_team_statistics')
        rows:
          # each side gets distinct values in every stat so a home/away swap is caught
          - {game_id: 1, team_id: 10, is_home: true, field_goals_made: 41, field_goals_attempted: 88, three_pointers_made: 12, rebounds_total: 45, assists: 25, turnovers: 11, points_in_the_paint: 48}
          - {game_id: 1, team_id: 20, is_home: false, field_goals_made: 37, field_goals_attempted: 85, three_pointers_made: 10, rebounds_total: 40, assists: 21, turnovers: 14, points_in_the_paint: 42}
          # home points_in_the_paint unrecorded (null) -> must stay null for home
          - {game_id: 2, team_id: 30, is_home: true, field_goals_made: 35, field_goals_attempted: 90, three_pointers_made: 9, rebounds_total: 42, assists: 19, turnovers: 16, points_in_the_paint: null}
          - {game_id: 2, team_id: 40, is_home: false, field_goals_made: 39, field_goals_attempted: 84, three_pointers_made: 14, rebounds_total: 47, assists: 27, turnovers: 10, points_in_the_paint: 38}
    expect:
      rows:
        - {game_id: 1, point_margin: 10, home_team_won: true,
           home_field_goals_made: 41, home_field_goals_attempted: 88, home_three_pointers_made: 12, home_rebounds_total: 45, home_assists: 25, home_turnovers: 11, home_points_in_the_paint: 48,
           away_field_goals_made: 37, away_field_goals_attempted: 85, away_three_pointers_made: 10, away_rebounds_total: 40, away_assists: 21, away_turnovers: 14, away_points_in_the_paint: 42}
        - {game_id: 2, point_margin: -7, home_team_won: false,
           home_field_goals_made: 35, home_field_goals_attempted: 90, home_three_pointers_made: 9, home_rebounds_total: 42, home_assists: 19, home_turnovers: 16, home_points_in_the_paint: null,
           away_field_goals_made: 39, away_field_goals_attempted: 84, away_three_pointers_made: 14, away_rebounds_total: 47, away_assists: 27, away_turnovers: 10, away_points_in_the_paint: 38}
        - {game_id: 3, point_margin: 1, home_team_won: true,
           home_field_goals_made: null, home_field_goals_attempted: null, home_three_pointers_made: null, home_rebounds_total: null, home_assists: null, home_turnovers: null, home_points_in_the_paint: null,
           away_field_goals_made: null, away_field_goals_attempted: null, away_three_pointers_made: null, away_rebounds_total: null, away_assists: null, away_turnovers: null, away_points_in_the_paint: null}

  - name: nba_game_results_flags_neutral_sites
    model: nba_game_results
    description: >
      Asserts the is_neutral_site rules: the 2020 Orlando bubble (season 2019
      from 1 July 2020, inclusive), the NBA Cup final, Cup games in the 3 days
      up to the final (inclusive), and All-Star games. Also covers the cases
      that must stay FALSE: pre-bubble 2019-20 games, Cup quarterfinals and
      group games, a non-Cup game inside the final's window, and a Cup game in
      a season whose final hasn't been played yet (null cup_final_date).
    given:
      - input: ref('stg_nba_team_statistics')
        rows: []
      - input: ref('stg_nba_games')
        rows:
          - {game_id: 1, game_date: 2023-11-01, season_start_year: 2023, game_type: Regular Season, game_label: null}
          # 2019-20 season: before the bubble, the first bubble day, inside the bubble
          - {game_id: 2, game_date: 2020-03-11, season_start_year: 2019, game_type: Regular Season, game_label: null}
          - {game_id: 3, game_date: 2020-07-01, season_start_year: 2019, game_type: Regular Season, game_label: null}
          - {game_id: 4, game_date: 2020-08-20, season_start_year: 2019, game_type: Playoffs, game_label: null}
          # 2024-25 Cup: final on 2024-12-17
          - {game_id: 5, game_date: 2024-12-17, season_start_year: 2024, game_type: NBA Cup Final, game_label: Emirates NBA Cup}
          - {game_id: 6, game_date: 2024-12-14, season_start_year: 2024, game_type: Regular Season, game_label: Emirates NBA Cup}
          - {game_id: 7, game_date: 2024-12-13, season_start_year: 2024, game_type: Regular Season, game_label: Emirates NBA Cup}
          - {game_id: 8, game_date: 2024-11-12, season_start_year: 2024, game_type: Regular Season, game_label: Emirates NBA Cup}
          - {game_id: 9, game_date: 2024-12-15, season_start_year: 2024, game_type: Regular Season, game_label: null}
          # 2025-26 Cup game with no final in the data yet
          - {game_id: 10, game_date: 2025-12-13, season_start_year: 2025, game_type: Regular Season, game_label: Emirates NBA Cup}
          - {game_id: 11, game_date: 2026-02-15, season_start_year: 2025, game_type: All-Star Game, game_label: All-Star}
    expect:
      rows:
        - {game_id: 1, is_neutral_site: false}   # ordinary regular season game
        - {game_id: 2, is_neutral_site: false}   # 2019-20, before the bubble
        - {game_id: 3, is_neutral_site: true}    # bubble start, >= boundary
        - {game_id: 4, is_neutral_site: true}    # bubble playoffs
        - {game_id: 5, is_neutral_site: true}    # Cup final
        - {game_id: 6, is_neutral_site: true}    # Cup semifinal, exactly final - 3 days
        - {game_id: 7, is_neutral_site: false}   # Cup quarterfinal, final - 4 days
        - {game_id: 8, is_neutral_site: false}   # Cup group game
        - {game_id: 9, is_neutral_site: false}   # inside the window but not a Cup game
        - {game_id: 10, is_neutral_site: false}  # Cup game, season's final not yet played
        - {game_id: 11, is_neutral_site: true}   # All-Star

  - name: nba_player_season_stats_aggregates_player_seasons
    model: nba_player_season_stats
    description: >
      Asserts one row per player per season per game type. Covers: a player
      traded mid-season combined into one row with primary_team_id the team
      they played most games for; playoff games for the same season kept as a
      separate row with their own primary team; made shots counted only in
      games where the matching attempts were recorded; per-game averages and
      rounded shooting percentages; and rows dropped for a missing person_id,
      minutes_played, game_date or game_type.
    given:
      - input: ref('stg_nba_players')
        rows:
          - {person_id: 1, first_name: Test, last_name: Player}
      - input: ref('stg_nba_team_statistics')
        rows: []
      - input: ref('stg_nba_player_statistics')
        rows:
          # 1999-00 regular season: 3 games for team 10, then traded to team 20 for 2
          # 101: FG 4/10, 3PT 1/3, FT 2/4
          - {game_id: 101, person_id: 1, player_team_id: 10, game_date: 1999-11-01, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 10, rebounds_total: 5, assists: 1, field_goals_made: 4, field_goals_attempted: 10, three_pointers_made: 1, three_pointers_attempted: 3, free_throws_made: 2, free_throws_attempted: 4}
          # 102: FG 5/10; FT made with no recorded attempts -> not counted
          - {game_id: 102, person_id: 1, player_team_id: 10, game_date: 1999-11-03, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 20, rebounds_total: 5, assists: 1, field_goals_made: 5, field_goals_attempted: 10, free_throws_made: 3, free_throws_attempted: null}
          # 103: FG made with no recorded attempts -> not counted
          - {game_id: 103, person_id: 1, player_team_id: 10, game_date: 1999-11-05, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 30, rebounds_total: 5, assists: 1, field_goals_made: 3, field_goals_attempted: null}
          - {game_id: 104, person_id: 1, player_team_id: 20, game_date: 2000-02-01, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 40, rebounds_total: 5, assists: 0, field_goals_made: 4, field_goals_attempted: 8}
          - {game_id: 105, person_id: 1, player_team_id: 20, game_date: 2000-02-03, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 50, rebounds_total: 6, assists: 0, field_goals_made: 2, field_goals_attempted: 12}
          # did not play (null minutes) -> excluded
          - {game_id: 106, person_id: 1, player_team_id: 20, game_date: 2000-02-05, season_start_year: 1999, game_type: Regular Season, minutes_played: null, points: 0}
          # missing game_date / game_type -> excluded
          - {game_id: 107, person_id: 1, player_team_id: 20, game_date: null, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 99}
          - {game_id: 108, person_id: 1, player_team_id: 20, game_date: 2000-02-07, season_start_year: 1999, game_type: null, minutes_played: 30, points: 99}
          # missing person_id -> excluded (no null-person row)
          - {game_id: 101, person_id: null, player_team_id: 10, game_date: 1999-11-01, season_start_year: 1999, game_type: Regular Season, minutes_played: 30, points: 99}
          # same season's playoffs, with team 20 -> separate row
          - {game_id: 201, person_id: 1, player_team_id: 20, game_date: 2000-04-20, season_start_year: 1999, game_type: Playoffs, minutes_played: 40, points: 25, rebounds_total: 10, assists: 4, field_goals_made: 9, field_goals_attempted: 20}
    expect:
      rows:
        # 5 games, 150 pts; FG 15/40 (game 103's 3 made dropped); 3PT 1/3; FT 2/4 (game 102's 3 made dropped)
        - {person_id: 1, first_name: Test, last_name: Player, season_start_year: 1999, season_label: 1999-00, game_type: Regular Season,
           primary_team_id: 10, games_played: 5, total_points: 150, total_rebounds: 26, total_assists: 3,
           total_field_goals_made: 15, total_field_goals_attempted: 40, total_three_pointers_made: 1, total_three_pointers_attempted: 3,
           total_free_throws_made: 2, total_free_throws_attempted: 4,
           points_per_game: 30.0, rebounds_per_game: 5.2, assists_per_game: 0.6,
           field_goal_pct: 0.375, three_point_pct: 0.333, free_throw_pct: 0.5}
        - {person_id: 1, first_name: Test, last_name: Player, season_start_year: 1999, season_label: 1999-00, game_type: Playoffs,
           primary_team_id: 20, games_played: 1, total_points: 25, total_rebounds: 10, total_assists: 4,
           total_field_goals_made: 9, total_field_goals_attempted: 20, total_three_pointers_made: null, total_three_pointers_attempted: null,
           total_free_throws_made: null, total_free_throws_attempted: null,
           points_per_game: 25.0, rebounds_per_game: 10.0, assists_per_game: 4.0,
           field_goal_pct: 0.45, three_point_pct: null, free_throw_pct: null}

  - name: nba_player_season_stats_qualifies_on_team_games
    model: nba_player_season_stats
    description: >
      Asserts team_games_played and is_qualified (games_played >= 70% of the
      primary team's games). Covers: exactly 70% qualifying (the >= boundary),
      just under not qualifying, a primary team missing from the team box
      scores falling back to the most games any team played that season and
      game type, and playoff rows getting team_games_played for the playoffs
      only and a null is_qualified.
    given:
      - input: ref('stg_nba_players')
        rows: []
      # 2023-24: team 10 plays 10 regular season games (1-10) and 4 playoff games
      # (11-14), team 20 plays 8 regular season games (21-28)
      - input: ref('stg_nba_team_statistics')
        format: sql
        rows: |
          select range::bigint as game_id, 10::bigint as team_id, 2023::bigint as season_start_year, 'Regular Season' as game_type from range(1, 11)
          union all select range, 10, 2023, 'Playoffs' from range(11, 15)
          union all select range, 20, 2023, 'Regular Season' from range(21, 29)
      - input: ref('stg_nba_player_statistics')
        format: sql
        rows: |
          -- player 1: 7 of team 10's 10 games -> exactly 70%, qualified
          select range::bigint as game_id, 1::bigint as person_id, 10::bigint as player_team_id, '2024-01-01'::date as game_date,
                 2023::bigint as season_start_year, 'Regular Season' as game_type, 30.0::double as minutes_played,
                 -- sql fixtures must supply every column the model reads; stats aren't under test here
                 null::double as points, null::double as rebounds_total, null::double as assists, null::double as steals,
                 null::double as blocks, null::double as turnovers, null::double as field_goals_made,
                 null::double as field_goals_attempted, null::double as three_pointers_made,
                 null::double as three_pointers_attempted, null::double as free_throws_made, null::double as free_throws_attempted
          from range(1, 8)
          -- player 2: 6 of team 10's 10 games -> not qualified
          union all select range, 2, 10, '2024-01-01'::date, 2023, 'Regular Season', 30.0, null, null, null, null, null, null, null, null, null, null, null, null from range(1, 7)
          -- player 3: team 30 has no team box rows -> falls back to the league max (10); 7 games, qualified
          union all select range, 3, 30, '2024-01-01'::date, 2023, 'Regular Season', 30.0, null, null, null, null, null, null, null, null, null, null, null, null from range(31, 38)
          -- player 1 in the playoffs: 2 of team 10's 4 playoff games -> is_qualified null
          union all select range, 1, 10, '2024-05-01'::date, 2023, 'Playoffs', 30.0, null, null, null, null, null, null, null, null, null, null, null, null from range(11, 13)
    expect:
      rows:
        - {person_id: 1, game_type: Regular Season, primary_team_id: 10, games_played: 7, team_games_played: 10, is_qualified: true}
        - {person_id: 2, game_type: Regular Season, primary_team_id: 10, games_played: 6, team_games_played: 10, is_qualified: false}
        - {person_id: 3, game_type: Regular Season, primary_team_id: 30, games_played: 7, team_games_played: 10, is_qualified: true}
        - {person_id: 1, game_type: Playoffs, primary_team_id: 10, games_played: 2, team_games_played: 4, is_qualified: null}

  - name: nba_player_advanced_career_sums_before_dividing
    model: nba_player_advanced_career
    description: >
      Asserts box-score career rates re-divide summed numerators and
      opportunities across stints (usage 30 + 10 plays over 100 + 100
      opportunities is 0.2, not the 0.2 mean by luck: the stints differ in
      size), that usage before 1977-78 is left out, that individual offensive
      rating is total points produced over total individual possessions, and
      that the NBA's on-court ratings are weighted by on-court possessions
      (120 over 30 possessions and 80 over 10 is 110.0) with preseason games
      excluded. A player missing from stg_nba_players keeps a row with null bio.
    given:
      - input: ref('int_nba_player_stints')
        rows:
          - {person_id: 1, team_id: 10, season_start_year: 2010, game_type: Regular Season, games_played: 50, minutes_played: 1500,
             usage_opportunity_numerator: 30, usage_opportunity: 100, assist_opportunity_numerator: 20, assist_opportunity: 100,
             rebound_opportunity_numerator: 10, rebound_opportunity: 100, ts_points: 100, ts_field_goals_attempted: 80,
             ts_free_throws_attempted: 25, field_goals_made: 40, field_goals_attempted: 80, three_pointers_made: 10,
             points_produced: 200, individual_possessions: 160, individual_defensive_rating: 100, rating_player_possessions: 300}
          - {person_id: 1, team_id: 20, season_start_year: 2011, game_type: Playoffs, games_played: 10, minutes_played: 500,
             usage_opportunity_numerator: 10, usage_opportunity: 100, assist_opportunity_numerator: 10, assist_opportunity: 100,
             rebound_opportunity_numerator: 30, rebound_opportunity: 100, ts_points: 0, ts_field_goals_attempted: 0,
             ts_free_throws_attempted: 0, field_goals_made: 0, field_goals_attempted: 0, three_pointers_made: 0,
             points_produced: 40, individual_possessions: 40, individual_defensive_rating: 110, rating_player_possessions: 100}
          # 1975-76: usage opportunity predates the 1977-78 coverage start -> excluded from usage
          - {person_id: 1, team_id: 10, season_start_year: 1975, game_type: Regular Season, games_played: 5, minutes_played: 100,
             usage_opportunity_numerator: 99, usage_opportunity: 100}
          - {person_id: 2, team_id: 30, season_start_year: 2010, game_type: Regular Season, games_played: 1, minutes_played: 30}
      - input: ref('stg_nba_player_statistics_extended')
        rows:
          - {game_id: 1, person_id: 1, game_type: Regular Season, minutes_played: 30, possessions: 30, offensive_rating: 120,
             defensive_rating: 100, player_impact_estimate: 0.15, is_double_double: true, is_triple_double: false}
          - {game_id: 2, person_id: 1, game_type: Playoffs, minutes_played: 10, possessions: 10, offensive_rating: 80,
             defensive_rating: 110, player_impact_estimate: 0.05, is_double_double: false, is_triple_double: false}
          - {game_id: 3, person_id: 1, game_type: Preseason, minutes_played: 30, possessions: 30, offensive_rating: 200,
             defensive_rating: 200, player_impact_estimate: 0.99, is_double_double: true, is_triple_double: true}
      - input: ref('stg_nba_players')
        rows:
          - {person_id: 1, first_name: Test, last_name: Player, is_guard: true, is_forward: false, is_center: false}
    expect:
      rows:
        - {person_id: 1, first_name: Test, games_played: 65, games_with_advanced: 2, minutes_per_game: 32.3,
           double_doubles: 1, triple_doubles: 0, usage_pct: 0.2, assist_pct: 0.15, rebound_pct: 0.2,
           true_shooting_pct: 0.476, effective_field_goal_pct: 0.563,
           offensive_rating: 110.0, defensive_rating: 102.5, net_rating: 7.5, player_impact_estimate: 0.125,
           individual_offensive_rating: 120.0, individual_defensive_rating: 102.5}
        - {person_id: 2, first_name: null, games_played: 1, games_with_advanced: 0, minutes_per_game: 30.0,
           double_doubles: 0, triple_doubles: 0, offensive_rating: null}

  - name: nba_player_season_advanced_combines_stints
    model: nba_player_season_advanced
    description: >
      A player traded mid-season has two stints. The season row adds their
      sums and re-divides: usage (30 + 10) / (100 + 100) = 0.2, steal % 2 / 200
      = 0.01, per-100 points 100 × 300 / 600 = 50.0; individual offensive
      rating is 100 × (240) / (200) = 120.0; individual defensive rating
      weights the stints by possessions ((100 × 300 + 110 × 100) / 400 = 102.5).
      team_count, is_multi_team and primary_team_id (most games) are set, and
      usage is null before 1977-78.
    given:
      - input: ref('int_nba_player_stints')
        rows:
          - {person_id: 1, team_id: 10, season_start_year: 2010, game_type: Regular Season, games_played: 50, minutes_played: 1500,
             points: 250, usage_opportunity_numerator: 30, usage_opportunity: 100, steal_opportunity_numerator: 1,
             steal_opportunity: 100, player_possessions: 400, per_100_points: 200, per_100_points_possessions: 400,
             points_produced: 200, individual_possessions: 160, individual_defensive_rating: 100,
             rating_player_possessions: 300}
          - {person_id: 1, team_id: 20, season_start_year: 2010, game_type: Regular Season, games_played: 20, minutes_played: 500,
             points: 50, usage_opportunity_numerator: 10, usage_opportunity: 100, steal_opportunity_numerator: 1,
             steal_opportunity: 100, player_possessions: 200, per_100_points: 100, per_100_points_possessions: 200,
             points_produced: 40, individual_possessions: 40, individual_defensive_rating: 110,
             rating_player_possessions: 100}
          - {person_id: 2, team_id: 10, season_start_year: 1975, game_type: Regular Season, games_played: 10, minutes_played: 300,
             usage_opportunity_numerator: 30, usage_opportunity: 100}
      - input: ref('int_nba_team_games')
        rows: []
      - input: ref('stg_nba_players')
        rows: []
    expect:
      rows:
        - {person_id: 1, season_start_year: 2010, primary_team_id: 10, team_count: 2, is_multi_team: true, games_played: 70,
           total_minutes: 2000.0, total_points: 300, usage_pct: 0.2, steal_pct: 0.01, points_per_100: 50.0,
           player_possessions: 600.0, individual_offensive_rating: 120.0, individual_defensive_rating: 102.5}
        - {person_id: 2, season_start_year: 1975, primary_team_id: 10, team_count: 1, is_multi_team: false, games_played: 10,
           total_minutes: 300.0, total_points: null, usage_pct: null, steal_pct: null, player_possessions: null,
           points_per_100: null, individual_offensive_rating: null, individual_defensive_rating: null}

  - name: nba_team_head_to_head_records_each_side
    model: nba_team_head_to_head
    description: >
      Asserts one row per ordered (team_id, opponent_team_id) pair, each from
      that team's own perspective: team 10's record against 20 and team 20's
      record against 10 are mirror images. Regular season, playoff, play-in and
      NBA Cup final meetings all count; averages round to 1 decimal place and
      win_pct to 3.
    given:
      - input: ref('stg_nba_team_statistics')
        rows:
          # 10 beats 20, 110-100 (regular season)
          - {game_id: 1, team_id: 10, opponent_team_id: 20, game_date: 2023-01-10, game_type: Regular Season, is_win: true, team_score: 110, opponent_score: 100}
          - {game_id: 1, team_id: 20, opponent_team_id: 10, game_date: 2023-01-10, game_type: Regular Season, is_win: false, team_score: 100, opponent_score: 110}
          # 20 beats 10, 105-95 (regular season)
          - {game_id: 2, team_id: 10, opponent_team_id: 20, game_date: 2023-02-10, game_type: Regular Season, is_win: false, team_score: 95, opponent_score: 105}
          - {game_id: 2, team_id: 20, opponent_team_id: 10, game_date: 2023-02-10, game_type: Regular Season, is_win: true, team_score: 105, opponent_score: 95}
          # 10 beats 20, 120-101 (playoffs)
          - {game_id: 3, team_id: 10, opponent_team_id: 20, game_date: 2023-05-01, game_type: Playoffs, is_win: true, team_score: 120, opponent_score: 101}
          - {game_id: 3, team_id: 20, opponent_team_id: 10, game_date: 2023-05-01, game_type: Playoffs, is_win: false, team_score: 101, opponent_score: 120}
          # 20 beats 10, 108-100 (play-in)
          - {game_id: 4, team_id: 10, opponent_team_id: 20, game_date: 2023-04-12, game_type: Play-in Tournament, is_win: false, team_score: 100, opponent_score: 108}
          - {game_id: 4, team_id: 20, opponent_team_id: 10, game_date: 2023-04-12, game_type: Play-in Tournament, is_win: true, team_score: 108, opponent_score: 100}
          # 10 beats 20, 115-110 (NBA Cup final) -> the last meeting
          - {game_id: 5, team_id: 10, opponent_team_id: 20, game_date: 2023-12-09, game_type: NBA Cup Final, is_win: true, team_score: 115, opponent_score: 110}

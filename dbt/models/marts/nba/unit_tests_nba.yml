        # TS 250 / (2 * (200 + 0.44 * 80)) = 0.531
        - {person_id: 1, game_type: Playoffs, first_name: Test, is_guard: true, draft_year: 2010, has_games_before_coverage: false,
           seasons_played: 1, first_season_start_year: 2010, last_season_start_year: 2010, first_game_date: 2011-04-17, last_game_date: 2011-05-10,

             counts_source: team_box, has_full_box: true}
    expect:
      rows:
        - {team_id: 1, effective_field_goal_pct: 0.534, turnover_pct: 0.124, offensive_rebound_pct: 0.275,
           free_throw_rate: 0.222, opp_effective_field_goal_pct: 0.478, opp_turnover_pct: 0.120,
           defensive_rebound_pct: 0.683, opp_free_throw_rate: 0.176}

  - name: nba_team_game_stats_gates_coverage
    model: nba_team_game_stats
    description: >
      Asserts possession metrics are null before 1973-74 even when the inputs
      exist, the three-point attempt rate is null before 1979-80, and a missing
      input nulls a metric rather than zero-filling it.
    given:
      - input: ref('int_nba_team_games')
        rows:
          # 1972-73: possessions exist upstream but predate the coverage start
          - {game_id: 1, team_id: 1, season_start_year: 1972, game_type: Regular Season, points: 100, opp_points: 90,
             team_minutes: 240, possessions: 100, field_goals_attempted: 90, three_pointers_attempted: 0,
             counts_source: player_sum, has_full_box: true}
          # 1985-86: turnovers missing -> turnover_pct null
          - {game_id: 2, team_id: 1, season_start_year: 1985, game_type: Regular Season, points: 100, opp_points: 90,
             team_minutes: 240, possessions: 100, field_goals_attempted: 90, free_throws_attempted: 20,
             three_pointers_attempted: 9, turnovers: null, counts_source: team_box, has_full_box: false}
    expect:
      rows:
        - {game_id: 1, possessions: null, offensive_rating: null, pace: null, three_point_attempt_rate: null}
        - {game_id: 2, possessions: 100.0, offensive_rating: 100.0, pace: 100.0, three_point_attempt_rate: 0.1,
           turnover_pct: null}

  - name: int_nba_team_season_srs_solves_toy_league
    model: int_nba_team_season_srs
    description: >
      Three teams whose margins are exactly consistent with ratings +10, 0 and
      -10 (A beats B by 10, B beats C by 10, A beats C by 20): SRS must converge
      to those ratings, MOV is 15 / 0 / -15 and SOS = SRS - MOV. Only
      Regular Season games count.
    given:
      - input: ref('int_nba_team_games')
        rows:
          - {game_id: 1, team_id: 1, opponent_team_id: 2, season_start_year: 2020, game_type: Regular Season, points: 110, opp_points: 100}
          - {game_id: 1, team_id: 2, opponent_team_id: 1, season_start_year: 2020, game_type: Regular Season, points: 100, opp_points: 110}
          - {game_id: 2, team_id: 2, opponent_team_id: 3, season_start_year: 2020, game_type: Regular Season, points: 105, opp_points: 95}
          - {game_id: 2, team_id: 3, opponent_team_id: 2, season_start_year: 2020, game_type: Regular Season, points: 95, opp_points: 105}
          - {game_id: 3, team_id: 1, opponent_team_id: 3, season_start_year: 2020, game_type: Regular Season, points: 120, opp_points: 100}
          - {game_id: 3, team_id: 3, opponent_team_id: 1, season_start_year: 2020, game_type: Regular Season, points: 100, opp_points: 120}
          # playoff game -> ignored
          - {game_id: 4, team_id: 3, opponent_team_id: 1, season_start_year: 2020, game_type: Playoffs, points: 150, opp_points: 50}
          - {game_id: 4, team_id: 1, opponent_team_id: 3, season_start_year: 2020, game_type: Playoffs, points: 50, opp_points: 150}
    expect:
      rows:
        - {season_start_year: 2020, team_id: 1, mov: 15.0, srs: 10.0, sos: -5.0, is_srs_converged: true}
        - {season_start_year: 2020, team_id: 2, mov: 0.0, srs: 0.0, sos: 0.0, is_srs_converged: true}
        - {season_start_year: 2020, team_id: 3, mov: -15.0, srs: -10.0, sos: 5.0, is_srs_converged: true}

  - name: int_nba_team_games_falls_back_to_complete_player_sums
    model: int_nba_team_games
    description: >
      Before 1983-84 the team box has scores only. Team 1's players are all
      recorded and add up to its score, so its counts come from the player sum;
      team 2 has a player with no field goal attempts recorded, so its FGA stays
      null (never zero-filled) and counts_source is none. Three-pointers are 0
      before 1979-80. The opponent columns pair the two sides.
    given:
      - input: ref('stg_nba_team_statistics')
        rows:
          - {game_id: 1, team_id: 1, opponent_team_id: 2, season_start_year: 1975, game_type: Regular Season,
             team_score: 30, opponent_score: 20, minutes_played: 240}
          - {game_id: 1, team_id: 2, opponent_team_id: 1, season_start_year: 1975, game_type: Regular Season,
             team_score: 20, opponent_score: 30, minutes_played: 240}
      - input: ref('int_nba_player_games')
        rows:
          - {game_id: 1, team_id: 1, person_id: 10, is_competitive: true, points: 20, minutes_played: 120, field_goals_made: 8, field_goals_attempted: 15}
          - {game_id: 1, team_id: 1, person_id: 11, is_competitive: true, points: 10, minutes_played: 120, field_goals_made: 4, field_goals_attempted: 10}
          - {game_id: 1, team_id: 2, person_id: 20, is_competitive: true, points: 12, minutes_played: 120, field_goals_made: 5, field_goals_attempted: 12}
          - {game_id: 1, team_id: 2, person_id: 21, is_competitive: true, points: 8, minutes_played: 120, field_goals_made: 3, field_goals_attempted: null}
    expect:
      rows:
        - {team_id: 1, counts_source: player_sum, field_goals_made: 12, field_goals_attempted: 25,
           three_pointers_made: 0, opp_field_goals_attempted: null, team_minutes: 240, overtime_periods: 0}
        - {team_id: 2, counts_source: none, field_goals_made: 8, field_goals_attempted: null,
           three_pointers_made: 0, opp_field_goals_attempted: 25, team_minutes: 240, overtime_periods: 0}

  - name: int_nba_team_games_drops_impossible_team_shooting
    model: int_nba_team_games
    description: >
      A team box score with more field goals made than attempted (as in a few
      1959-62 games that record only part of the attempts) is treated as
      unrecorded: team 1's pair falls back to its complete player sum, while
      team 2, whose player rows are incomplete, stays null. Free throws, which
      are consistent, are kept from the team box.
    given:
      - input: ref('stg_nba_team_statistics')
        rows:
          - {game_id: 1, team_id: 1, opponent_team_id: 2, season_start_year: 1960, game_type: Regular Season,
             team_score: 30, opponent_score: 20, minutes_played: 240, field_goals_made: 12, field_goals_attempted: 8,
             free_throws_made: 6, free_throws_attempted: 9}
          - {game_id: 1, team_id: 2, opponent_team_id: 1, season_start_year: 1960, game_type: Regular Season,
             team_score: 20, opponent_score: 30, minutes_played: 240, field_goals_made: 9, field_goals_attempted: 4}
      - input: ref('int_nba_player_games')
        rows:
          - {game_id: 1, team_id: 1, person_id: 10, is_competitive: true, points: 30, minutes_played: 240, field_goals_made: 12, field_goals_attempted: 25}
          - {game_id: 1, team_id: 2, person_id: 20, is_competitive: true, points: 12, minutes_played: 120, field_goals_made: 5, field_goals_attempted: 12}
          - {game_id: 1, team_id: 2, person_id: 21, is_competitive: true, points: 8, minutes_played: 120, field_goals_made: 4, field_goals_attempted: null}
    expect:
      rows:
        - {team_id: 1, counts_source: player_sum, field_goals_made: 12, field_goals_attempted: 25,
           free_throws_made: 6, free_throws_attempted: 9}
        - {team_id: 2, counts_source: none, field_goals_made: 9, field_goals_attempted: null,
           free_throws_made: null, free_throws_attempted: null}

  - name: int_nba_player_games_resolves_teams_and_flags
    model: int_nba_player_games
    description: >
      Asserts the played-game filter (minutes, person, date and type all
      present), team recovery from the game's home/away team when the raw team
      id is blank, is_competitive by game type, minutes nulled for a game where
      nobody has minutes recorded, impossible shooting pairs (made > attempted)
      nulled, and double/triple-doubles from the box score (an unrecorded
      assists count doesn't block a points-rebounds double-double).
    given:
      - input: ref('stg_nba_games')
        rows:
          - {game_id: 1, home_team_id: 10, away_team_id: 20}
          - {game_id: 2, home_team_id: 30, away_team_id: 40}
      - input: ref('stg_nba_player_statistics')
        rows:
          # raw team present
          - {game_id: 1, person_id: 1, player_team_id: 10, opponent_team_id: 20, is_home: true, game_date: 2021-11-01, season_start_year: 2021,
             game_type: Regular Season, minutes_played: 30, points: 25, rebounds_total: 12, assists: 10, steals: 1, blocks: 0,
             field_goals_made: 10, field_goals_attempted: 20, free_throws_made: 5, free_throws_attempted: 4}
          # raw team blank (2021-22) -> away team 20, opponent 10
          - {game_id: 1, person_id: 2, player_team_id: null, opponent_team_id: null, is_home: false, game_date: 2021-11-01, season_start_year: 2021,
             game_type: Regular Season, minutes_played: 20, points: 12, rebounds_total: 11, assists: null}
          # preseason: kept, not competitive
          - {game_id: 2, person_id: 3, player_team_id: 30, is_home: true, game_date: 2021-10-05, season_start_year: 2021,
             game_type: Preseason, minutes_played: 0, points: 4}
          # excluded: no minutes, no date, no type, no person
          - {game_id: 1, person_id: 4, player_team_id: 10, is_home: true, game_date: 2021-11-01, season_start_year: 2021, game_type: Regular Season, minutes_played: null, points: 0}
          - {game_id: 1, person_id: 5, player_team_id: 10, is_home: true, game_date: null, season_start_year: 2021, game_type: Regular Season, minutes_played: 10, points: 0}
          - {game_id: 1, person_id: 6, player_team_id: 10, is_home: true, game_date: 2021-11-01, season_start_year: 2021, game_type: null, minutes_played: 10, points: 0}
          - {game_id: 1, person_id: null, player_team_id: 10, is_home: true, game_date: 2021-11-01, season_start_year: 2021, game_type: Regular Season, minutes_played: 10, points: 0}
    expect:
      rows:
        # FT 5/4 is impossible -> both nulled; points-rebounds-assists triple-double
        - {game_id: 1, person_id: 1, team_id: 10, opponent_team_id: 20, is_team_inferred: false, is_competitive: true, minutes_played: 30,
           field_goals_made: 10, field_goals_attempted: 20, free_throws_made: null, free_throws_attempted: null,
           is_double_double: true, is_triple_double: true}
        - {game_id: 1, person_id: 2, team_id: 20, opponent_team_id: 10, is_team_inferred: true, is_competitive: true, minutes_played: 20,
           is_double_double: true, is_triple_double: false}
        # the only player in game 2 has 0 minutes -> minutes not recorded
        - {game_id: 2, person_id: 3, team_id: 30, opponent_team_id: 40, is_team_inferred: false, is_competitive: false, minutes_played: null,
           is_double_double: false, is_triple_double: false}

  - name: int_nba_play_events_judges_clutch_on_the_score_before
    model: int_nba_play_events
    description: >
      Clutch time is the last five minutes of the fourth quarter or overtime
      with the score within five, judged on the score before the event: the
      basket that opens a six-point lead is clutch, the next one (taken at
      six) is not. Events with no player (a timeout) carry the score but are
      not output. team_margin_before is from the player's team's side, and
      opponent_team_id comes from the game record.
    given:
      - input: ref('stg_nba_play_by_play')
        rows:
          - {game_id: 1, action_number: 1, event_order: 1, period: 4, clock_seconds_remaining: 320, event_type: timeout,
             person_id: null, team_id: 10, score_home: 90, score_away: 86}
          - {game_id: 1, action_number: 2, event_order: 2, period: 4, clock_seconds_remaining: 290, event_type: field_goal,
             person_id: 1, team_id: 10, score_home: 92, score_away: 86, is_shot_made: true, shot_value: 2, points_scored: 2}
          - {game_id: 1, action_number: 3, event_order: 3, period: 4, clock_seconds_remaining: 250, event_type: field_goal,
             person_id: 2, team_id: 20, score_home: 92, score_away: 89, is_shot_made: true, shot_value: 3, points_scored: 3}
          - {game_id: 1, action_number: 4, event_order: 4, period: 5, clock_seconds_remaining: 100, event_type: rebound,
             person_id: 1, team_id: 10, score_home: 92, score_away: 89}
          - {game_id: 1, action_number: 5, event_order: 5, period: 3, clock_seconds_remaining: 100, event_type: rebound,
             person_id: 2, team_id: 20, score_home: 92, score_away: 89}
      - input: ref('stg_nba_games')
        rows:
          - {game_id: 1, game_date: 2016-03-01, home_team_id: 10, away_team_id: 20}
    expect:
      rows:
        # 90-86 before: within five
        - {action_number: 2, person_id: 1, is_home: true, opponent_team_id: 20, is_clutch: true, team_margin_before: 4}
        # 92-86 before: six apart
        - {action_number: 3, person_id: 2, is_home: false, opponent_team_id: 10, is_clutch: false, team_margin_before: -6}
        # overtime, 92-89 before
        - {action_number: 4, person_id: 1, is_home: true, opponent_team_id: 20, is_clutch: true, team_margin_before: 3}
        # third quarter
        - {action_number: 5, person_id: 2, is_home: false, opponent_team_id: 10, is_clutch: false, team_margin_before: -3}

  - name: nba_shot_events_zones_and_go_ahead
    model: nba_shot_events
    description: >
      Field goals get a court zone from their coordinates (restricted area
      under 4 ft, the rest of the 16-ft lane, mid-range, corner and
      above-the-break threes, heaves from 40 ft); free throws get none, and a
      blank make or points becomes false / 0. A go-ahead field goal turns a
      tie or deficit into a lead; tying the game does not count. Non-shot
      events are left out.
    given:
      - input: ref('int_nba_play_events')
        rows:
          - {game_id: 1, action_number: 1, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: field_goal,
             shot_value: 2, is_shot_made: true, points_scored: 2, shot_x: 5, shot_y: 10, shot_distance_ft: 1.1,
             is_clutch: true, team_margin_before: -1}
          - {game_id: 1, action_number: 2, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: field_goal,
             shot_value: 3, is_shot_made: false, points_scored: 0, shot_x: -220, shot_y: 50, shot_distance_ft: 22.6,
             is_clutch: false, team_margin_before: 0}
          - {game_id: 1, action_number: 3, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: field_goal,
             shot_value: 3, is_shot_made: true, points_scored: 3, shot_x: 0, shot_y: 260, shot_distance_ft: 26.0,
             is_clutch: true, team_margin_before: -3}
          - {game_id: 1, action_number: 4, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: field_goal,
             shot_value: 2, is_shot_made: true, points_scored: 2, shot_x: 30, shot_y: 100, shot_distance_ft: 10.4,
             is_clutch: false, team_margin_before: 5}
          - {game_id: 1, action_number: 5, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: field_goal,
             shot_value: 2, is_shot_made: true, points_scored: 2, shot_x: 150, shot_y: 120, shot_distance_ft: 19.2,
             is_clutch: false, team_margin_before: 5}
          - {game_id: 1, action_number: 6, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: field_goal,
             shot_value: 3, is_shot_made: false, points_scored: 0, shot_x: 0, shot_y: 450, shot_distance_ft: 45.0,
             is_clutch: false, team_margin_before: 5}
          - {game_id: 1, action_number: 7, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: free_throw,
             shot_value: 1, is_shot_made: null, points_scored: null, is_clutch: true, team_margin_before: 0}
          - {game_id: 1, action_number: 8, person_id: 1, season_start_year: 2015, game_type: Regular Season, event_type: rebound,
             is_clutch: true, team_margin_before: 0}
    expect:
      rows:
        - {action_number: 1, shot_type: field_goal, shot_zone: Restricted Area, shot_zone_order: 1, is_shot_made: true, points_scored: 2, is_go_ahead: true}
        - {action_number: 2, shot_type: field_goal, shot_zone: Corner 3, shot_zone_order: 4, is_shot_made: false, points_scored: 0, is_go_ahead: false}
        # from three down to tied: not a go-ahead
        - {action_number: 3, shot_type: field_goal, shot_zone: Above the Break 3, shot_zone_order: 5, is_shot_made: true, points_scored: 3, is_go_ahead: false}
        - {action_number: 4, shot_type: field_goal, shot_zone: In The Paint (Non-RA), shot_zone_order: 2, is_shot_made: true, points_scored: 2, is_go_ahead: false}
        - {action_number: 5, shot_type: field_goal, shot_zone: Mid-Range, shot_zone_order: 3, is_shot_made: true, points_scored: 2, is_go_ahead: false}
        - {action_number: 6, shot_type: field_goal, shot_zone: Heave, shot_zone_order: 6, is_shot_made: false, points_scored: 0, is_go_ahead: false}
        - {action_number: 7, shot_type: free_throw, shot_zone: null, shot_zone_order: null, is_shot_made: false, points_scored: 0, is_go_ahead: false}

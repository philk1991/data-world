        - {team_id: 10, season_start_year: 1999, season_label: 1999-00, games_played: 1, wins: 1, losses: 0,
           home_wins: 1, away_wins: 0, total_points_for: 100, total_points_against: 90,
           win_pct: 1.0, points_for_per_game: 100.0, points_against_per_game: 90.0, point_margin_per_game: 10.0}


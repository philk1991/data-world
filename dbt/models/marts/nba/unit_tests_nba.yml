  - name: nba_player_career_stats_sums_career_scopes
    model: nba_player_career_stats
    description: >
      Asserts one row per player per career scope, summed from
      nba_player_season_stats: Regular Season and Playoffs seasons each get
      their own row (they add up to a combined career), play-in and preseason
      rows are left out, seasons before 1954-55 are left out and flagged with
      has_games_before_coverage, and rates are recomputed from the summed
      made/attempted and ts_* columns. Per-game averages divide by the games
      with the stat recorded (assists in 120 of 140 games: 4.7, not 4.0). A
      player missing from stg_nba_players keeps a row with null bio.
    given:
      - input: ref('stg_nba_players')
        rows:
          - {person_id: 1, first_name: Test, last_name: Player, is_guard: true, is_forward: false, is_center: false, draft_year: 2010, height_inches: 78}
      - input: ref('nba_player_season_stats')
        rows:

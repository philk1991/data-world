             total_field_goals_made: 600, total_field_goals_attempted: 1300, total_three_pointers_made: 100, total_three_pointers_attempted: 300,
             total_free_throws_made: 300, total_free_throws_attempted: 400, ts_points: 1600, ts_field_goals_attempted: 1300, ts_free_throws_attempted: 400}
          - {person_id: 1, first_name: Test, last_name: Player, season_start_year: 2011, game_type: Regular Season, games_played: 60,
             games_with_rebounds: 60, games_with_assists: 40,
             first_game_date: 2011-12-25, last_game_date: 2012-04-26, total_points: 1400, total_rebounds: 300, total_assists: 240,
             total_field_goals_made: 500, total_field_goals_attempted: 1000, total_three_pointers_made: 100, total_three_pointers_attempted: 200,
             total_free_throws_made: 300, total_free_throws_attempted: 350, ts_points: 1400, ts_field_goals_attempted: 1000, ts_free_throws_attempted: 350}
          - {person_id: 1, first_name: Test, last_name: Player, season_start_year: 2010, game_type: Playoffs, games_played: 10,
             games_with_rebounds: 10, games_with_assists: 10,
             first_game_date: 2011-04-17, last_game_date: 2011-05-10, total_points: 250, total_rebounds: 60, total_assists: 50,
             total_field_goals_made: 90, total_field_goals_attempted: 200, total_free_throws_made: 70, total_free_throws_attempted: 80,
             ts_points: 250, ts_field_goals_attempted: 200, ts_free_throws_attempted: 80}
          # play-in and preseason rows -> not in either career scope
          - {person_id: 1, season_start_year: 2012, game_type: Play-in Tournament, games_played: 1, total_points: 30}
          - {person_id: 1, season_start_year: 2012, game_type: Preseason, games_played: 5, total_points: 99}
          # player 2: a 1950-51 season (before coverage, left out) and a 1954-55 season; no bio record
          - {person_id: 2, first_name: Old, last_name: Timer, season_start_year: 1950, game_type: Regular Season, games_played: 60, total_points: 900}
          - {person_id: 2, first_name: Old, last_name: Timer, season_start_year: 1954, game_type: Regular Season, games_played: 70,
             first_game_date: 1954-10-30, last_game_date: 1955-03-13, total_points: 1050}
          # player 3: preseason only -> no row
          - {person_id: 3, season_start_year: 2012, game_type: Preseason, games_played: 3, total_points: 12}
    expect:
      rows:
        # 140 games, 3000 pts; FG 1100/2300, 3PT 200/500, FT 600/750; TS 3000 / (2 * (2300 + 0.44 * 750)) = 0.570;
        # assists recorded in 120 games, so 560 / 120 = 4.7 per game

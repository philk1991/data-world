  - name: nba_player_season_advanced
    description: >
      One row per player per season per game type: the metrics of
      nba_player_stint_advanced with a traded player's stints combined (rates
      re-divide the summed numerators and opportunities; individual offensive
      rating is total points produced over total individual possessions;
      individual defensive rating is weighted by possessions). team_count and
      is_multi_team flag traded players. Filter game_type = 'Regular Season'
      for season leaderboards, and set a minutes minimum (e.g. 500, scaled for
      shortened seasons) before ranking rates.
    tests:
      - dbt_utils.unique_combination_of_columns:

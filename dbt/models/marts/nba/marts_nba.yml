      - name: individual_defensive_rating
        description: "{{ doc('nba__individual_defensive_rating') }}"
      - name: formula_version
        description: "{{ doc('nba__formula_version') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per (person_id, team_id, season_start_year, game_type)
        purpose: Player advanced metrics per team stint, with team context from that team's games.
        business_question: How did a player perform for each team they played for in a season?
        seasonality: >
          Shooting from 1946-47 where attempts were recorded; AST% and TRB% from 1964-65; ORB/DRB/STL/BLK%,
          per-100 and DRtg from 1973-74 (complete from 1983-84); usage, TOV% and ORtg from 1977-78.
        relationships:
          decomposes_into:
            - "int_nba_player_stints: the summed numerators and opportunities"
          correlates_with:
            - "nba_player_season_advanced: the same metrics with stints combined"

  - name: nba_player_season_advanced
    description: >

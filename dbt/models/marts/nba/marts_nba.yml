            - "nba_player_stint_advanced: one row per team stint"
            - "nba_player_season_stats: primary_team_id, team_games_played, is_qualified and is_fg_qualified"
          correlates_with:
            - "nba_player_season_stats: traditional totals at the same grain"
  - name: nba_seasons_dim
    description: >
      Conformed season dimension: one row per season in the game records, with
      the coverage facts consumers filter on. coverage_tier is
      incomplete_schedule before 1954-55 (the source holds only the 30 current
      franchises, so games against defunct teams are missing), in_progress for
      the latest season, and complete otherwise. Careers, Cube and nao filter on
      is_in_coverage by default.
      {{ doc('nba__upstream_gap_2024_25') }}
    columns:
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
          - unique
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: season_first_game_date
        description: Date of the season's first game of any type.
        tests:
          - not_null
      - name: season_last_game_date
        description: Date of the season's latest game of any type in the data.
        tests:
          - not_null
      - name: regular_season_games
        description: Regular Season games in the game records for the season.
        tests:
          - not_null
      - name: playoff_games
        description: Playoff games in the game records for the season.
        tests:
          - not_null
      - name: teams
        description: Teams with Regular Season team box scores that season.
      - name: min_team_regular_season_games
        description: Fewest Regular Season games any team played; differs from max_team_regular_season_games in shortened or incomplete seasons.
      - name: max_team_regular_season_games
        description: Most Regular Season games any team played.
      - name: is_current
        description: True for the latest season in the data (usually in progress).
        tests:
          - not_null
      - name: coverage_tier
        description: incomplete_schedule (before 1954-55, games against defunct franchises missing), in_progress (the latest season) or complete.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["incomplete_schedule", "in_progress", "complete"]
      - name: is_in_coverage
        description: True from 1954-55 (dbt var nba_first_complete_season), the seasons careers, Cube and nao's defaults include.
        tests:
          - not_null

    config:
      meta:
        grain: one row per season_start_year
        purpose: One place to say which seasons are complete, current or out of coverage.
        business_question: Which seasons can be compared fairly, and which season is "this season"?
        relationships:
          decomposes_into:
            - "stg_nba_games: season span and game counts"
            - "stg_nba_team_statistics: teams and games per team"
  - name: nba_game_types_dim
    description: >
      Conformed game type dimension: one row per game type decoded from the
      game id, with is_competitive (Regular Season, Play-in Tournament, Playoffs,
      NBA Cup Final) and is_career (Regular Season and Playoffs, the career
      scopes; play-in and Cup final games count toward neither).
    columns:
      - name: game_type_code
        description: The type digit in the game id (00TYYNNNNN).
        tests:
          - not_null
          - unique
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - unique
      - name: is_competitive
        description: "{{ doc('nba__is_competitive') }}"
        tests:
          - not_null
      - name: is_career
        description: True for Regular Season and Playoffs, the two career scopes, which can be added together.
        tests:
          - not_null
      - name: counts_toward_standings
        description: True only for Regular Season games (NBA Cup group and knockout games are Regular Season; the Cup final is not).
        tests:
          - not_null

    config:
      meta:
        grain: one row per game_type
        purpose: One definition of which game types count, for competitive and career scopes.
        business_question: Which games should a total or a career include?
  - name: nba_team_seasons_dim
    description: >
      Team-season dimension: one row per team per season it played, with the
      team's identity as of that season (city, name and abbreviation; the
      2007-08 SuperSonics, not today's Thunder). nba_team_dim carries the
      current identity.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season_start_year
    columns:
      - name: team_id
        description: "{{ doc('nba__team_id') }}"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('nba_team_dim')
                field: team_id
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: team_city
        description: The team's city that season.
        tests:
          - not_null
      - name: team_name
        description: "{{ doc('nba__team_name') }}"
        tests:
          - not_null
      - name: team_full_name
        description: City and name that season (e.g. "Seattle SuperSonics" for 2007-08).
        tests:
          - not_null
      - name: team_abbrev
        description: "{{ doc('nba__team_abbrev') }} Null where no franchise era covers the season."

    config:
      meta:
        grain: one row per (team_id, season_start_year)
        purpose: Name a team the way it was known that season.
        business_question: What was this franchise called in a given season?
        relationships:
          decomposes_into:
            - "stg_nba_team_statistics: the season's team city and name"
            - "stg_nba_team_histories: the abbreviation of the franchise era"

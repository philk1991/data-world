version: 2

models:
  - name: nba_game_results
    description: >
      One row per NBA game combining game metadata and result with both teams'
      traditional box score lines, pivoted onto a home/away axis. Box score
      columns are null for older games where team statistics were not recorded.
      Ordered by game_date descending.
    columns:
      - name: game_id
        description: "{{ doc('nba__game_id') }}"
        tests:
          - not_null
          - unique
      - name: game_date
        description: "{{ doc('nba__game_date') }}"
        tests:
          - not_null
      - name: game_datetime_est
        description: "{{ doc('nba__game_datetime_est') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: is_neutral_site
        description: >
          True for games with no real home court: the 2020 Orlando bubble
          (scrimmages, seeding games, play-in and playoffs), NBA Cup semifinals
          and finals in Las Vegas, and All-Star games. The home/away labels on
          these games are nominal, so exclude them from home-advantage analysis.
          International regular season games are not flagged (no arena data
          before 2025-26 to identify them).
        tests:
          - not_null
      - name: home_team_id
        description: "{{ doc('nba__home_team_id') }}"
        tests:
          - not_null
      - name: home_team_name
        description: Name of the home team.
      - name: away_team_id
        description: "{{ doc('nba__away_team_id') }}"
        tests:
          - not_null
      - name: away_team_name
        description: Name of the away team.
      - name: home_score
        description: "{{ doc('nba__home_score') }}"
      - name: away_score
        description: "{{ doc('nba__away_score') }}"
      - name: point_margin
        description: "{{ doc('nba__point_margin__game') }}"
      - name: home_team_won
        description: "{{ doc('nba__home_team_won') }}"
        tests:
          - not_null
      - name: attendance
        description: "{{ doc('nba__attendance') }}"
      - name: arena_name
        description: Name of the arena the game was played in.
      - name: home_field_goals_made
        description: Field goals made by the home team.
      - name: home_field_goals_attempted
        description: Field goals attempted by the home team.
      - name: home_three_pointers_made
        description: Three pointers made by the home team.
      - name: home_rebounds_total
        description: Total rebounds by the home team.
      - name: home_assists
        description: Assists by the home team.
      - name: home_turnovers
        description: Turnovers by the home team.
      - name: home_points_in_the_paint
        description: Points in the paint scored by the home team.
      - name: away_field_goals_made
        description: Field goals made by the away team.
      - name: away_field_goals_attempted
        description: Field goals attempted by the away team.
      - name: away_three_pointers_made
        description: Three pointers made by the away team.
      - name: away_rebounds_total
        description: Total rebounds by the away team.
      - name: away_assists
        description: Assists by the away team.
      - name: away_turnovers
        description: Turnovers by the away team.
      - name: away_points_in_the_paint
        description: Points in the paint scored by the away team.
      - name: ingested_at
        description: "{{ doc('nba__ingested_at') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per game_id
        purpose: Join game metadata with home/away team box scores via conditional aggregation to produce a single analysis-ready row per game.
        business_question: How did each game play out — result, margin, and the shooting, rebounding and ball-movement lines for each side?
        relationships:
          decomposes_into:
            - "stg_nba_games: source of game metadata, scores and result"
            - "stg_nba_team_statistics: source of per-team box scores, pivoted to home/away"
  - name: nba_player_career_stats
    description: >
      One row per player aggregating their traditional box score totals,
      per-game averages and shooting efficiency across their competitive games
      (Regular Season, Playoffs, Play-in Tournament and NBA Cup Final; preseason
      and All-Star games are excluded), enriched with player biography. Only
      games the player actually played (minutes_played is not null) are
      counted. Ordered by total_points descending. Career figures cover only
      games present in the dataset.
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
          - unique
      - name: first_name
        description: "{{ doc('nba__first_name') }}"
      - name: last_name
        description: "{{ doc('nba__last_name') }}"
      - name: is_guard
        description: "{{ doc('nba__is_guard') }}"
      - name: is_forward
        description: "{{ doc('nba__is_forward') }}"
      - name: is_center
        description: "{{ doc('nba__is_center') }}"
      - name: draft_year
        description: "{{ doc('nba__draft_year') }}"
      - name: height_inches
        description: "{{ doc('nba__height_inches') }}"
      - name: first_game_date
        description: "{{ doc('nba__first_game_date') }}"
        tests:
          - not_null:
              config:
                severity: warn
      - name: last_game_date
        description: "{{ doc('nba__last_game_date') }}"
        tests:
          - not_null:
              config:
                severity: warn
      - name: games_played
        description: "{{ doc('nba__games_played__player') }}"
        tests:
          - not_null
      - name: total_points
        description: "{{ doc('nba__total_points') }}"
        tests:
          - not_null
      - name: total_rebounds
        description: "{{ doc('nba__total_rebounds') }}"
      - name: total_assists
        description: "{{ doc('nba__total_assists') }}"
      - name: total_steals
        description: "{{ doc('nba__total_steals') }}"
      - name: total_blocks
        description: "{{ doc('nba__total_blocks') }}"
      - name: total_turnovers
        description: "{{ doc('nba__total_turnovers') }}"
      - name: points_per_game
        description: "{{ doc('nba__points_per_game') }}"
      - name: rebounds_per_game
        description: "{{ doc('nba__rebounds_per_game') }}"
      - name: assists_per_game
        description: "{{ doc('nba__assists_per_game') }}"
      - name: career_field_goal_pct
        description: Career field goal percentage (made / attempted), 0-1.
      - name: career_three_point_pct
        description: Career three point percentage (made / attempted), 0-1.
      - name: career_free_throw_pct
        description: Career free throw percentage (made / attempted), 0-1.

    config:
      meta:
        grain: one row per person_id
        purpose: Aggregate per-game box scores up to a career-level row per player, joined with bio for position, draft and height context.
        business_question: Who are the most prolific scorers in the dataset, and what do their career averages and shooting splits look like?
        relationships:
          decomposes_into:
            - "stg_nba_player_statistics: source of all aggregated box score totals"
            - "stg_nba_players: source of name, position flags, draft year and height"
  - name: nba_team_season_summary
    description: >
      One row per team per regular season with win/loss record, home/away wins
      and scoring averages. Season comes from the game id, so the 2020 bubble
      games belong to 2019-20. Restricted to Regular Season games. Ordered by season then win percentage.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season_start_year
    columns:
      - name: team_id
        description: "{{ doc('nba__team_id') }}"
        tests:
          - not_null
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: games_played
        description: "{{ doc('nba__games_played__team') }}"
        tests:
          - not_null
      - name: wins
        description: "{{ doc('nba__wins') }}"
        tests:
          - not_null
      - name: losses
        description: "{{ doc('nba__losses') }}"
        tests:
          - not_null
      - name: home_wins
        description: Wins in games where the team was the home side.
        tests:
          - not_null
      - name: away_wins
        description: Wins in games where the team was the away side.
        tests:
          - not_null
      - name: win_pct
        description: "{{ doc('nba__win_pct') }}"
      - name: total_points_for
        description: Total points scored across the season's games.
      - name: total_points_against
        description: Total points conceded across the season's games.
      - name: points_for_per_game
        description: Average points scored per game.
      - name: points_against_per_game
        description: Average points conceded per game.
      - name: point_margin_per_game
        description: Average scoring margin per game (points for minus against).

    config:
      meta:
        grain: one row per (team_id, season_start_year)
        purpose: Aggregate regular-season team box scores into a season-level standings row per team, taking the season from the game id.
        business_question: How did each team perform in a given regular season — record, home/away split and scoring margin?
        relationships:
          decomposes_into:
            - "stg_nba_team_statistics: source of per-game team results and scores"
  - name: nba_team_dim
    description: >
      Conformed franchise dimension, one row per team_id carrying the team's
      current identity (city, name, abbreviation, league) with relocation and
      rename history rolled up from the franchise eras in stg_nba_team_histories.
      Intended as the join target that gives every team_id a readable label.
    columns:
      - name: team_id
        description: "{{ doc('nba__team_id') }}"
        tests:
          - not_null
          - unique
      - name: current_team_city
        description: City of the franchise's most recent era.
        tests:
          - not_null
      - name: current_team_name
        description: Team name of the franchise's most recent era.
        tests:
          - not_null
      - name: current_full_name
        description: City and name concatenated (e.g. "Los Angeles Lakers").
        tests:
          - not_null
      - name: current_team_abbrev
        description: Team abbreviation of the most recent era.
      - name: current_league
        description: League of the most recent era (NBA, BAA, ABA, etc.).
        tests:
          - not_null
      - name: current_era_season_founded
        description: First season of the franchise's most recent era.
        tests:
          - not_null
      - name: current_era_active_till
        description: Last season of the current era; null when still active.
      - name: franchise_first_season
        description: Earliest founding season across all of the franchise's eras.
        tests:
          - not_null
      - name: franchise_era_count
        description: Number of distinct eras (relocations/renames) on record.
        tests:
          - not_null
      - name: has_relocated_or_renamed
        description: True when the franchise has more than one era on record.
        tests:
          - not_null

    config:
      meta:
        grain: one row per team_id
        purpose: Resolve each team_id to its latest franchise identity and expose relocation/rename history as a single dimension row.
        business_question: What is this team called today, and has the franchise relocated or been renamed over its history?
        relationships:
          decomposes_into:
            - "stg_nba_team_histories: source of every franchise era; latest era kept via QUALIFY"
  - name: nba_players_dim
    description: >
      Conformed player dimension, one row per person_id carrying biography
      (birth date, height, weight, position, draft, school, country) and the
      span of competitive games played (Regular Season, Playoffs, Play-in
      Tournament and NBA Cup Final, games with recorded minutes only). Covers
      every player in the bio table and every player in the box scores;
      box-score-only players (has_bio_record false) take their name from their
      latest box score and have null bio. Height and weight are a single
      current listing, not per-season values. Intended as the join target that
      adds age and physical profile to the player stats marts.
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
          - unique
      - name: first_name
        description: "{{ doc('nba__first_name') }} Taken from the latest box score when the player has no bio record."
      - name: last_name
        description: "{{ doc('nba__last_name') }} Taken from the latest box score when the player has no bio record."
      - name: player_name
        description: First and last name joined with a space; null when both are missing.
      - name: has_bio_record
        description: >
          True when the player has a row in the bio table. False for players who
          only appear in the box scores, whose bio columns are all null.
        tests:
          - not_null
      - name: birth_date
        description: "{{ doc('nba__birth_date') }}"
      - name: height_inches
        description: "{{ doc('nba__height_inches') }}"
      - name: height_cm
        description: height_inches converted to centimetres, rounded to 0.1.
      - name: height_feet_inches
        description: Height as feet-inches (e.g. "6-9"), the way NBA rosters list it.
      - name: body_weight_lbs
        description: "{{ doc('nba__body_weight_lbs') }}"
      - name: body_weight_kg
        description: body_weight_lbs converted to kilograms, rounded to 0.1.
      - name: is_guard
        description: "{{ doc('nba__is_guard') }}"
      - name: is_forward
        description: "{{ doc('nba__is_forward') }}"
      - name: is_center
        description: "{{ doc('nba__is_center') }}"
      - name: position
        description: >
          Listed positions combined from the guard/forward/center flags in that
          order (G, F, C, G-F, F-C); null when no position is listed.
        tests:
          - accepted_values:
              arguments:
                values: ['G', 'F', 'C', 'G-F', 'F-C', 'G-C', 'G-F-C']
      - name: school
        description: College or school the player came from; null when unknown.
      - name: country
        description: Country the player is from; null when unknown.
      - name: is_undrafted
        description: "{{ doc('nba__is_undrafted') }}"
      - name: draft_year
        description: "{{ doc('nba__draft_year') }}"
      - name: draft_round
        description: "{{ doc('nba__draft_round') }}"
      - name: draft_number
        description: "{{ doc('nba__draft_number') }}"
      - name: first_game_date
        description: "{{ doc('nba__first_game_date') }} Also null for players with no competitive games."
      - name: last_game_date
        description: "{{ doc('nba__last_game_date') }} Also null for players with no competitive games."
      - name: first_season_start_year
        description: Season (start year) of the player's first competitive game with recorded minutes; null when they have none.
      - name: last_season_start_year
        description: Season (start year) of the player's latest competitive game with recorded minutes; null when they have none.
      - name: seasons_played
        description: Distinct seasons with at least one competitive game with recorded minutes; null when they have none.
      - name: played_in_last_two_seasons
        description: >
          True when the player's last competitive game is in the latest season in
          the dataset or the one before, a proxy for an active player that still
          holds early in a new season; null when they have no competitive games.
      - name: age_at_first_game
        description: Age in completed years on first_game_date; null when birth_date or first_game_date is null.
      - name: age_at_last_game
        description: Age in completed years on last_game_date; null when birth_date or last_game_date is null.

    config:
      meta:
        grain: one row per person_id
        purpose: Resolve each person_id to a single biography row with physical profile, draft and career span, so player stats can be profiled by age, height and weight.
        business_question: How old, tall and heavy is this player, how were they drafted, and when did their career start and end?
        relationships:
          decomposes_into:
            - "stg_nba_players: source of biography, position flags and draft details"
            - "stg_nba_player_statistics: source of names for players without a bio row, and of the competitive-game career span"
          correlates_with:
            - "nba_player_season_stats, nba_player_career_stats, nba_player_advanced_career: share person_id"
  - name: nba_team_advanced_profile
    description: >
      One row per team per season per game type (Regular Season, Play-in
      Tournament, Playoffs, NBA Cup Final) explaining how the team got its
      record: offensive/defensive/net rating, pace, the Four Factors on both
      ends, shot profile, Pythagorean and luck wins, SRS and gaps to the league
      average. Covers every season from 1946-47, with each metric null where its
      inputs were not recorded (coverage_flag). Every rate is computed from the
      season's summed counts (macros/nba_metrics.sql), never by averaging
      per-game rates. Filter game_type = 'Regular Season' for standings-season
      profiles. Ordered by season, game type, then net rating descending.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season_start_year
              - game_type
    columns:
      - name: team_id
        description: "{{ doc('nba__team_id') }}"
        tests:
          - not_null
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Regular Season", "Play-in Tournament", "Playoffs", "NBA Cup Final"]
      - name: games_played
        description: "{{ doc('nba__games_played__team_advanced') }}"
        tests:
          - not_null
      - name: wins
        description: "{{ doc('nba__wins') }}"
      - name: losses
        description: "{{ doc('nba__losses') }}"
      - name: possessions
        description: "{{ doc('nba__possessions') }} Estimated once from the season's summed counts over games_with_full_box."
      - name: offensive_rating
        description: "{{ doc('nba__offensive_rating') }} Season points over season possessions; 1973-74 on."
      - name: defensive_rating
        description: "{{ doc('nba__defensive_rating') }} Season opponent points over season possessions; 1973-74 on."
      - name: net_rating
        description: "{{ doc('nba__net_rating') }}"
      - name: pace
        description: "{{ doc('nba__pace') }} From season possessions and team minutes."
      - name: effective_field_goal_pct
        description: "{{ doc('nba__effective_field_goal_pct') }} From season totals."
      - name: true_shooting_pct
        description: "{{ doc('nba__true_shooting_pct') }} From season totals."
      - name: assist_pct
        description: "{{ doc('nba__assist_pct__team') }} From season totals."
      - name: rebound_pct
        description: "{{ doc('nba__rebound_pct') }} Team rebounds over team plus opponent rebounds, from season totals."
      - name: turnover_pct
        description: "{{ doc('nba__turnover_pct') }}"
      - name: three_point_attempt_rate
        description: "{{ doc('nba__three_point_attempt_rate') }}"
      - name: points_in_paint_share
        description: Share of points scored in the paint, 0-1, over the games where paint points were recorded (from ~1996-97).
      - name: fast_break_points_share
        description: Share of points scored on fast breaks, 0-1, over the games where fast-break points were recorded (from ~1996-97).
      - name: offensive_rebound_pct
        description: "{{ doc('nba__offensive_rebound_pct') }}"
      - name: free_throw_rate
        description: "{{ doc('nba__free_throw_rate') }}"
      - name: opp_effective_field_goal_pct
        description: "{{ doc('nba__opp_effective_field_goal_pct') }}"
      - name: opp_turnover_pct
        description: "{{ doc('nba__opp_turnover_pct') }}"
      - name: defensive_rebound_pct
        description: "{{ doc('nba__defensive_rebound_pct') }}"
      - name: opp_free_throw_rate
        description: "{{ doc('nba__opp_free_throw_rate') }}"
      - name: margin_of_victory
        description: Average points margin per game (points minus opponent points over games_played). All seasons.
      - name: pythagorean_wins
        description: >
          Wins expected from points scored and allowed, games × PTS^14 / (PTS^14 + opponent PTS^14)
          (Basketball-Reference's exponent). All seasons.
      - name: luck_wins
        description: Actual wins minus pythagorean_wins; positive means the team won more than its scoring margin suggests.
      - name: simple_rating_system
        description: >
          SRS: margin of victory adjusted for opponent strength, in points per game; the league is centred
          on 0 each season. Basketball-Reference's iterative definition (int_nba_team_season_srs).
          Regular Season only; null for other game types.
      - name: strength_of_schedule
        description: SOS = SRS minus margin of victory; positive means a harder-than-average schedule. Regular Season only.
      - name: relative_offensive_rating
        description: Offensive rating minus the league's offensive rating that season and game type (nba_league_season_baselines).
      - name: relative_defensive_rating
        description: Defensive rating minus the league's offensive rating that season and game type; negative is better than average.
      - name: relative_pace
        description: Pace minus the league's pace that season and game type.
      - name: relative_effective_field_goal_pct
        description: Effective field goal percentage minus the league's that season and game type.
      - name: relative_true_shooting_pct
        description: True shooting percentage minus the league's that season and game type.
      - name: games_with_counts
        description: Games with box counts (counts_source team_box or player_sum); the sample for shooting and assist rates.
      - name: games_with_full_box
        description: Games from 1973-74 with a full box on both sides; the sample for possessions, ratings, pace and turnover and rebound shares.
      - name: coverage_flag
        description: >
          How much of the season the samples cover: full (every game has a full box), shooting_only (box counts
          for every game but no full boxes), partial (some games have box counts), scores_only (none do).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["full", "shooting_only", "partial", "scores_only"]
      - name: formula_version
        description: "{{ doc('nba__formula_version') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per (team_id, season_start_year, game_type)
        purpose: Season-level efficiency profile that explains how a team achieved its record, comparable across eras.
        business_question: How efficient was each team in a given season — offence, defence, pace, shot selection, schedule strength and luck?
        seasonality: >
          Scores from 1946-47; shooting from summed player box scores where complete; ratings and possession metrics
          from 1973-74 (complete from 1983-84); three-point rate from 1979-80. Pace and three-point attempt rate trend
          upward over time.
        relationships:
          decomposes_into:
            - "nba_team_game_stats: the same counts per game"
            - "int_nba_team_season_srs: SRS and SOS"
          correlates_with:
            - "nba_team_season_summary: Regular Season record at the same team-season grain"
            - "nba_league_season_baselines: the league averages the relative_* columns subtract"
  - name: nba_player_advanced_career
    description: >
      One row per player summarising career efficiency over competitive games
      (Regular Season, Playoffs, Play-in Tournament and NBA Cup Final; preseason
      and All-Star games excluded), enriched with bio. Box-score rates (usage,
      TS%, eFG%, AST%, TRB%, individual ratings) are recomputed from the
      career's summed numerators and opportunities, so they cover every era
      from each metric's coverage start. The NBA-supplied on-court ratings and
      PIE exist only from 1996-97: ratings are weighted by on-court possessions,
      PIE by minutes. Ordered by career triple-doubles then net rating.
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
          - unique
      - name: first_name
        description: "{{ doc('nba__first_name') }}"
      - name: last_name
        description: "{{ doc('nba__last_name') }}"
      - name: is_guard
        description: "{{ doc('nba__is_guard') }}"
      - name: is_forward
        description: "{{ doc('nba__is_forward') }}"
      - name: is_center
        description: "{{ doc('nba__is_center') }}"
      - name: games_played
        description: "{{ doc('nba__games_played__player') }} Across the career."
        tests:
          - not_null
      - name: games_with_advanced
        description: Games with advanced box score data (1996-97 on) and recorded minutes; the sample for the on-court ratings, PIE and double/triple-doubles.
        tests:
          - not_null
      - name: minutes_per_game
        description: Average minutes over games with recorded minutes (from 1964-65).
      - name: double_doubles
        description: Count of double-double games in the advanced-stats era.
        tests:
          - not_null
      - name: triple_doubles
        description: Count of triple-double games in the advanced-stats era.
        tests:
          - not_null
      - name: usage_pct
        description: "{{ doc('nba__usage_pct') }} Box estimate over the career from 1977-78."
      - name: true_shooting_pct
        description: "{{ doc('nba__true_shooting_pct') }} From career totals."
      - name: effective_field_goal_pct
        description: "{{ doc('nba__effective_field_goal_pct') }} From career totals."
      - name: offensive_rating
        description: "{{ doc('nba__offensive_rating') }} NBA-supplied on-court rating, weighted by on-court possessions; 1996-97 on."
      - name: defensive_rating
        description: "{{ doc('nba__defensive_rating') }} NBA-supplied on-court rating, weighted by on-court possessions; 1996-97 on."
      - name: net_rating
        description: "{{ doc('nba__net_rating') }} On-court; 1996-97 on."
      - name: assist_pct
        description: "{{ doc('nba__assist_pct__player') }} Box estimate over the career from 1964-65."
      - name: rebound_pct
        description: "{{ doc('nba__rebound_pct') }} Box estimate over the career from 1964-65."
      - name: player_impact_estimate
        description: "{{ doc('nba__player_impact_estimate') }} Minutes-weighted; 1996-97 on."
      - name: individual_offensive_rating
        description: "{{ doc('nba__individual_offensive_rating') }} Career points produced over career individual possessions."
      - name: individual_defensive_rating
        description: "{{ doc('nba__individual_defensive_rating') }} Weighted by possessions across stints."
      - name: formula_version
        description: "{{ doc('nba__formula_version') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per person_id
        purpose: Career efficiency line for every player, with the NBA's on-court ratings for the advanced-stats era.
        business_question: Which players have been the most efficient and impactful, and who racks up the most triple-doubles?
        seasonality: All eras from each metric's coverage start; on-court ratings, PIE and double/triple-doubles from 1996-97.
        relationships:
          decomposes_into:
            - "int_nba_player_stints: summed numerators and opportunities"
            - "stg_nba_player_statistics_extended: on-court ratings, PIE and dd/td flags"
            - "stg_nba_players: name and position flags"
          correlates_with:
            - "nba_player_career_stats: same grain; pairs counting totals with efficiency"
  - name: nba_player_season_stats
    description: >
      One row per player per season per game type (Regular Season, Playoffs,
      etc.) of traditional box score totals, per-game averages and shooting
      splits, enriched with bio. Season comes from the game id. A player
      traded mid-season is combined into one row per game type, with
      primary_team_id set to the team they played the most games for. Only games
      actually played count. Splitting by game_type lets visualisations compare
      regular-season and playoff production. Ordered by season then total points
      descending.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - season_start_year
              - game_type
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
      - name: first_name
        description: "{{ doc('nba__first_name') }}"
      - name: last_name
        description: "{{ doc('nba__last_name') }}"
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }} The totals cover games of this type."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Regular Season"
                  - "Playoffs"
                  - "Play-in Tournament"
                  - "Preseason"
                  - "All-Star Game"
                  - "NBA Cup Final"
      - name: primary_team_id
        description: "{{ doc('nba__primary_team_id') }} Null for old seasons where team ids were not recorded."
      - name: games_played
        description: "{{ doc('nba__games_played__player') }}"
        tests:
          - not_null
      - name: team_games_played
        description: >
          Games of this type the player's primary team played that season, so
          games_played can be read as a share of the games available. Falls
          back to the most games any team played when primary_team_id is null.
          Differs from 82 in short or uneven seasons (1998-99: 50, 2011-12: 66,
          2019-20: 64-75, 2020-21: 72). Null for All-Star games before 2025-26, which have
          no team box scores.
        tests:
          - not_null:
              config:
                where: "game_type <> 'All-Star Game'"
      - name: is_qualified
        description: >
          True when the player appeared in at least 70% of team_games_played,
          the NBA's 58-of-82 per-game minimum scaled to the games the team
          actually played. Use it for per-game leaderboards instead of a fixed
          games threshold, which is biased in short seasons. Null outside the
          Regular Season.
      - name: total_points
        description: "{{ doc('nba__total_points') }}"
        tests:
          - not_null
      - name: total_rebounds
        description: "{{ doc('nba__total_rebounds') }}"
      - name: total_assists
        description: "{{ doc('nba__total_assists') }}"
      - name: total_steals
        description: "{{ doc('nba__total_steals') }}"
      - name: total_blocks
        description: "{{ doc('nba__total_blocks') }}"
      - name: total_turnovers
        description: "{{ doc('nba__total_turnovers') }}"
      - name: total_field_goals_made
        description: Field goals made that season, counted only in games where attempts were also recorded so it pairs with total_field_goals_attempted.
      - name: total_field_goals_attempted
        description: Field goals attempted that season; null for seasons before attempts were recorded (~1980s and earlier).
      - name: total_three_pointers_made
        description: Three pointers made that season, counted only in games where attempts were also recorded; null before the three-point line (1979-80).
      - name: total_three_pointers_attempted
        description: Three pointers attempted that season; null before attempts were recorded.
      - name: total_free_throws_made
        description: Free throws made that season, counted only in games where attempts were also recorded so it pairs with total_free_throws_attempted.
      - name: total_free_throws_attempted
        description: Free throws attempted that season; null for seasons before attempts were recorded.
      - name: points_per_game
        description: "{{ doc('nba__points_per_game') }}"
      - name: rebounds_per_game
        description: "{{ doc('nba__rebounds_per_game') }}"
      - name: assists_per_game
        description: "{{ doc('nba__assists_per_game') }}"
      - name: field_goal_pct
        description: "{{ doc('nba__field_goal_pct') }} Over the season, counting made shots only in games where attempts were recorded."
      - name: three_point_pct
        description: "{{ doc('nba__three_point_pct') }} Over the season, counting made shots only in games where attempts were recorded."
      - name: free_throw_pct
        description: "{{ doc('nba__free_throw_pct') }} Over the season, counting made shots only in games where attempts were recorded."

    config:
      meta:
        grain: one row per (person_id, season_start_year, game_type)
        purpose: Aggregate per-game box scores to a season-and-game-type line per player, the season-grain counterpart to nba_player_career_stats.
        business_question: How did each player perform in a given season, split by regular season vs playoffs, and how do their numbers trend over time?
        relationships:
          decomposes_into:
            - "stg_nba_player_statistics: source of all aggregated box score totals"
            - "stg_nba_players: source of name and bio context"
          correlates_with:
            - "nba_player_career_stats: career rollup of these same season rows"
            - "nba_team_dim: join on primary_team_id for the player's main team that season"
  - name: nba_player_game_stats
    description: >
      One row per player per game played (minutes recorded), from 1946-47 to the
      latest ingest: the traditional box score with game context (season, game
      type, team, opponent, home/away, result, starter), plus advanced
      efficiency (usage, true shooting, ratings, PIE) from 1996-97 on, null
      before. Uses the same played-game filter as nba_player_season_stats, so a
      player's rows for a season and game type add up to that mart's
      games_played and totals. The game-grain counterpart to
      nba_player_season_stats. Ordered by game date descending.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - game_id
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
      - name: game_id
        description: "{{ doc('nba__game_id') }}"
        tests:
          - not_null
      - name: first_name
        description: "{{ doc('nba__first_name') }} From the bio table, falling back to the box score when the player has no bio record."
      - name: last_name
        description: "{{ doc('nba__last_name') }} From the bio table, falling back to the box score when the player has no bio record."
      - name: game_date
        description: "{{ doc('nba__game_date') }}"
        tests:
          - not_null
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Regular Season"
                  - "Playoffs"
                  - "Play-in Tournament"
                  - "Preseason"
                  - "All-Star Game"
                  - "NBA Cup Final"
      - name: player_team_id
        description: "{{ doc('nba__player_team_id') }}"
      - name: opponent_team_id
        description: "{{ doc('nba__opponent_team_id') }}"
      - name: is_home
        description: "{{ doc('nba__is_home') }}"
      - name: is_win
        description: "{{ doc('nba__is_win') }}"
      - name: is_starter
        description: True when the player started the game (starting_position is set), false when they came off the bench.
        tests:
          - not_null
      - name: starting_position
        description: Position the player started at (G, F or C); null when they came off the bench.
        tests:
          - accepted_values:
              arguments:
                values: ["G", "F", "C"]
      - name: minutes_played
        description: "{{ doc('nba__minutes_played') }} Zero for some older games, where the box score records an appearance but no minutes."
        tests:
          - not_null
      - name: points
        description: "{{ doc('nba__points') }}"
      - name: rebounds_offensive
        description: "{{ doc('nba__rebounds_offensive') }}"
      - name: rebounds_defensive
        description: "{{ doc('nba__rebounds_defensive') }}"
      - name: rebounds_total
        description: "{{ doc('nba__rebounds_total') }}"
      - name: assists
        description: "{{ doc('nba__assists') }}"
      - name: steals
        description: "{{ doc('nba__steals') }}"
      - name: blocks
        description: "{{ doc('nba__blocks') }}"
      - name: turnovers
        description: "{{ doc('nba__turnovers') }}"
      - name: fouls_personal
        description: "{{ doc('nba__fouls_personal') }}"
      - name: field_goals_made
        description: "{{ doc('nba__field_goals_made') }}"
      - name: field_goals_attempted
        description: "{{ doc('nba__field_goals_attempted') }} Null in older games where attempts were not recorded."
      - name: field_goal_pct
        description: "{{ doc('nba__field_goal_pct') }} In this game; null when there were no attempts or attempts were not recorded."
      - name: three_pointers_made
        description: "{{ doc('nba__three_pointers_made') }} nba_player_season_stats only counts these in games where three_pointers_attempted is recorded."
      - name: three_pointers_attempted
        description: "{{ doc('nba__three_pointers_attempted') }} Null before the three-point line (1979-80) and where attempts were not recorded."
      - name: three_point_pct
        description: "{{ doc('nba__three_point_pct') }} In this game; null when there were no attempts or attempts were not recorded."
      - name: free_throws_made
        description: "{{ doc('nba__free_throws_made') }}"
      - name: free_throws_attempted
        description: "{{ doc('nba__free_throws_attempted') }} Null in older games where attempts were not recorded."
      - name: free_throw_pct
        description: "{{ doc('nba__free_throw_pct') }} In this game; null when there were no attempts or attempts were not recorded."
      - name: plus_minus_points
        description: Team points minus opponent points while the player was on the floor; null in older games where it was not recorded.
      - name: game_score
        description: "{{ doc('nba__game_score') }}"
      - name: usage_pct
        description: "{{ doc('nba__usage_pct') }} Null before 1996-97."
      - name: true_shooting_pct
        description: "{{ doc('nba__true_shooting_pct') }} Null before 1996-97."
      - name: effective_field_goal_pct
        description: "{{ doc('nba__effective_field_goal_pct') }} Null before 1996-97."
      - name: offensive_rating
        description: "{{ doc('nba__offensive_rating') }} Null before 1996-97."
      - name: defensive_rating
        description: "{{ doc('nba__defensive_rating') }} Null before 1996-97."
      - name: net_rating
        description: "{{ doc('nba__net_rating') }} Null before 1996-97."
      - name: assist_pct
        description: "{{ doc('nba__assist_pct__player') }} Null before 1996-97."
      - name: rebound_pct
        description: "{{ doc('nba__rebound_pct') }} Null before 1996-97."
      - name: player_impact_estimate
        description: "{{ doc('nba__player_impact_estimate') }} Null before 1996-97."
      - name: is_double_double
        description: True when the player reached double figures in at least two of points, rebounds, assists, steals and blocks. Computed from the box score, so it covers every era (steals and blocks only count from 1973-74).
        tests:
          - not_null
      - name: is_triple_double
        description: True when the player reached double figures in at least three of points, rebounds, assists, steals and blocks. Computed from the box score, so it covers every era (steals and blocks only count from 1973-74).
        tests:
          - not_null
    config:
      meta:
        grain: one row per (person_id, game_id)
        purpose: Expose every player's box score for each game played, with game context and advanced efficiency, as the game-grain base for game logs, single-game records and streaks.
        business_question: How did a player perform game by game, what are the best single-game performances, and how does form change across a season?
        relationships:
          decomposes_into:
            - "stg_nba_player_statistics: one box score row per player per game (played games only)"
            - "stg_nba_player_statistics_extended: advanced efficiency for the same player-game, 1996-97 on"
            - "stg_nba_players: source of name"
          correlates_with:
            - "nba_player_season_stats: season and game-type rollup of these rows"
            - "nba_game_results: join on game_id for the final score and venue"
            - "nba_players_dim: join on person_id for age and physical profile"
            - "nba_team_dim: join on player_team_id or opponent_team_id for readable names"
  - name: nba_player_shot_zones
    description: >
      One row per player per season, game type and shot zone, from the
      play-by-play (1996-97 to the latest ingest): attempts, makes, field goal %,
      points per shot and the share of the player's attempts from the zone, with
      the league's figures for the same zone, season and game type alongside.
      Zones follow the NBA's court areas (Restricted Area, In The Paint (Non-RA),
      Mid-Range, Corner 3, Above the Break 3) plus Heave for shots from 40+ ft,
      computed from shot coordinates so they are consistent across both
      play-by-play feeds. Field goals only. A player's attempts across zones
      match the box score's field goal attempts for almost every player-season.
      No minimum attempts: filter on field_goals_attempted for meaningful rates.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - season_start_year
              - game_type
              - shot_zone
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
      - name: first_name
        description: "{{ doc('nba__first_name') }} From the bio table, falling back to the box score; null for a few hundred players with no name anywhere in the data (mostly preseason opponents)."
      - name: last_name
        description: "{{ doc('nba__last_name') }} From the bio table, falling back to the box score; null where first_name is."
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Regular Season"
                  - "Playoffs"
                  - "Play-in Tournament"
                  - "Preseason"
                  - "All-Star Game"
                  - "NBA Cup Final"
      - name: shot_zone
        description: >
          Court area the shot was taken from, from its coordinates. Restricted
          Area: under 4 ft from the basket. In The Paint (Non-RA): the rest of
          the 16-ft-wide lane. Mid-Range: any other two. Corner 3: a three from
          below the break in the arc, along the sidelines. Above the Break 3: any
          other three. Heave: any shot from 40+ ft (end-of-quarter attempts).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Restricted Area"
                  - "In The Paint (Non-RA)"
                  - "Mid-Range"
                  - "Corner 3"
                  - "Above the Break 3"
                  - "Heave"
      - name: shot_zone_order
        description: Sort order for shot_zone, from the basket outwards (1 = Restricted Area, 6 = Heave).
        tests:
          - not_null
      - name: field_goals_attempted
        description: "{{ doc('nba__field_goals_attempted') }} From this zone."
        tests:
          - not_null
      - name: field_goals_made
        description: "{{ doc('nba__field_goals_made') }} From this zone."
        tests:
          - not_null
      - name: field_goal_pct
        description: "{{ doc('nba__field_goal_pct') }} From this zone."
        tests:
          - not_null
      - name: field_goal_points
        description: Points scored on field goals from this zone (2 or 3 per make).
        tests:
          - not_null
      - name: points_per_shot
        description: field_goal_points / field_goals_attempted. The best single measure of a zone's value, since it counts threes as worth more.
        tests:
          - not_null
      - name: share_of_attempts
        description: Share of the player's field goal attempts for the season and game type taken from this zone, 0-1. Sums to 1 across a player's zones.
        tests:
          - not_null
      - name: avg_shot_distance_ft
        description: Average distance of the player's attempts from this zone, in feet.
      - name: league_field_goal_pct
        description: Field goal percentage of every player's attempts from this zone in the same season and game type, 0-1.
        tests:
          - not_null
      - name: league_points_per_shot
        description: Points per shot of every player's attempts from this zone in the same season and game type.
        tests:
          - not_null
      - name: league_share_of_attempts
        description: Share of all the league's field goal attempts in the season and game type taken from this zone, 0-1. Compare with share_of_attempts for how a player's shot diet differs from the league's.
        tests:
          - not_null
      - name: field_goal_pct_vs_league
        description: field_goal_pct minus league_field_goal_pct. Positive means the player shot better than the league from this zone.
        tests:
          - not_null
    config:
      meta:
        grain: one row per (person_id, season_start_year, game_type, shot_zone)
        purpose: Show where each player shoots from and how efficiently, against the league, for every season with play-by-play.
        business_question: Where does a player take their shots, how well do they convert from each area compared with the league, and how has the league's shot mix changed (e.g. the decline of the mid-range two)?
        relationships:
          decomposes_into:
            - "stg_nba_play_by_play: one field goal event per attempt, zoned from its coordinates"
            - "stg_nba_players: source of name"
          correlates_with:
            - "nba_player_season_stats: join on person_id, season_start_year and game_type for the full season box score"
            - "nba_players_dim: join on person_id for position and physical profile"
  - name: nba_player_clutch_stats
    description: >
      One row per player per season and game type with at least one clutch
      event, from the play-by-play (1996-97 to the latest ingest). Clutch time is
      the NBA's definition: the last five minutes of the fourth quarter or any
      overtime, with the score within five points (judged on the score before
      each event). Clutch scoring, shooting splits, true shooting, rebounds,
      turnovers and go-ahead field goals, with the player's true shooting across
      all minutes of the same season as a baseline. The play-by-play doesn't
      record who was on the floor, so clutch_games counts games with at least
      one clutch event of the player's own. Assists, steals and blocks are left
      out because the legacy feed (to early 2019-20) lacks them.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - season_start_year
              - game_type
    columns:
      - name: person_id
        description: "{{ doc('nba__person_id') }}"
        tests:
          - not_null
      - name: first_name
        description: "{{ doc('nba__first_name') }} From the bio table, falling back to the box score; null for a few hundred players with no name anywhere in the data (mostly preseason opponents)."
      - name: last_name
        description: "{{ doc('nba__last_name') }} From the bio table, falling back to the box score; null where first_name is."
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Regular Season"
                  - "Playoffs"
                  - "Play-in Tournament"
                  - "Preseason"
                  - "All-Star Game"
                  - "NBA Cup Final"
      - name: clutch_games
        description: Games in which the player recorded at least one clutch-time event (shot, free throw, rebound, turnover or foul). Undercounts games the player was on the floor for in the clutch without recording anything.
        tests:
          - not_null
      - name: clutch_points
        description: Points scored in clutch time.
        tests:
          - not_null
      - name: clutch_points_per_game
        description: clutch_points / clutch_games.
        tests:
          - not_null
      - name: clutch_field_goals_made
        description: Field goals made in clutch time.
        tests:
          - not_null
      - name: clutch_field_goals_attempted
        description: Field goals attempted in clutch time.
        tests:
          - not_null
      - name: clutch_field_goal_pct
        description: clutch_field_goals_made / clutch_field_goals_attempted, 0-1. Null with no clutch attempts.
      - name: clutch_three_pointers_made
        description: Three pointers made in clutch time.
        tests:
          - not_null
      - name: clutch_three_pointers_attempted
        description: Three pointers attempted in clutch time.
        tests:
          - not_null
      - name: clutch_three_point_pct
        description: clutch_three_pointers_made / clutch_three_pointers_attempted, 0-1. Null with no clutch three-point attempts.
      - name: clutch_free_throws_made
        description: Free throws made in clutch time.
        tests:
          - not_null
      - name: clutch_free_throws_attempted
        description: Free throws attempted in clutch time.
        tests:
          - not_null
      - name: clutch_free_throw_pct
        description: clutch_free_throws_made / clutch_free_throws_attempted, 0-1. Null with no clutch free throws.
      - name: clutch_true_shooting_pct
        description: "{{ doc('nba__true_shooting_pct') }} In clutch time only."
      - name: true_shooting_pct
        description: "{{ doc('nba__true_shooting_pct') }} Across all the player's minutes in the season and game type, from the same play-by-play: the baseline to compare clutch_true_shooting_pct with."
      - name: clutch_rebounds
        description: Rebounds (offensive and defensive) in clutch time.
        tests:
          - not_null
      - name: clutch_turnovers
        description: Turnovers committed in clutch time.
        tests:
          - not_null
      - name: clutch_go_ahead_field_goals
        description: Made clutch-time field goals that took the player's team from tied or behind to ahead.
        tests:
          - not_null
    config:
      meta:
        grain: one row per (person_id, season_start_year, game_type)
        purpose: Measure how players perform in close games late on, against their own all-minutes efficiency.
        business_question: Who scores and shoots best when games are close at the end, who hits go-ahead shots, and does a player's efficiency rise or fall in the clutch?
        relationships:
          decomposes_into:
            - "stg_nba_play_by_play: the player's events, flagged clutch from the game clock and the score before each event"
            - "stg_nba_games: home team, to put the score on the player's side for go-ahead shots"
            - "stg_nba_players: source of name"
          correlates_with:
            - "nba_player_season_stats: join on person_id, season_start_year and game_type for the full season box score"
            - "nba_player_shot_zones: same grain plus shot_zone"
  - name: nba_team_head_to_head
    description: >
      All-time matchup record, one row per ordered (team_id, opponent_team_id)
      pair. A team's row against an opponent is its record from its own
      perspective; the reverse matchup is a separate row. Restricted to
      competitive meetings (Regular Season, Playoffs, Play-in Tournament and NBA
      Cup Final), excluding preseason and All-Star games. Ordered by games_played
      descending.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - opponent_team_id
    columns:
      - name: team_id
        description: "{{ doc('nba__team_id') }} The team whose perspective this row is from."
        tests:
          - not_null
      - name: opponent_team_id
        description: "{{ doc('nba__opponent_team_id') }}"
        tests:
          - not_null
      - name: games_played
        description: "{{ doc('nba__games_played__head_to_head') }}"
        tests:
          - not_null
      - name: wins
        description: "{{ doc('nba__wins') }} Against opponent_team_id."
        tests:
          - not_null
      - name: losses
        description: "{{ doc('nba__losses') }} Against opponent_team_id."
        tests:
          - not_null
      - name: win_pct
        description: "{{ doc('nba__win_pct') }}"
      - name: avg_points_for
        description: Average points scored by team_id in the matchup.
      - name: avg_points_against
        description: Average points conceded by team_id in the matchup.
      - name: avg_point_margin
        description: Average scoring margin (points for minus against).
      - name: first_meeting_date
        description: Date of the earliest meeting on record.
        tests:
          - not_null
      - name: last_meeting_date
        description: Date of the most recent meeting on record.
        tests:
          - not_null
    config:
      meta:
        grain: one row per (team_id, opponent_team_id)
        purpose: Aggregate every competitive meeting between two franchises into a single all-time head-to-head record per team perspective.
        business_question: What is a team's all-time record against a given opponent, and how lopsided is the rivalry?
        relationships:
          decomposes_into:
            - "stg_nba_team_statistics: source of every per-team, per-game result"
          correlates_with:
            - "nba_team_dim: join on team_id or opponent_team_id for readable names"

  - name: nba_team_game_stats
    description: >
      One row per team per competitive game (Regular Season, Play-in Tournament,
      Playoffs, NBA Cup Final): box counts for the team and its opponent (opp_
      columns), box-estimated possessions and pace, offensive/defensive/net
      rating, the eight Four Factors and style rates. Formulas come from
      macros/nba_metrics.sql. Single-game rates are noisy: to compare periods,
      sum the counts and recompute rather than averaging rows. Possession-based
      metrics start in 1973-74 and are null where an input is missing; counts
      before 1983-84 are summed from complete player box scores (counts_source).
    tests:
      - dbt_utils.unique_combination_of_columns:

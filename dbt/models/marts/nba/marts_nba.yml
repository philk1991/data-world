        description: "{{ doc('nba__opp_effective_field_goal_pct') }}"
      - name: opp_turnover_pct
        description: "{{ doc('nba__opp_turnover_pct') }}"
      - name: defensive_rebound_pct
        description: "{{ doc('nba__defensive_rebound_pct') }}"
      - name: opp_free_throw_rate
        description: "{{ doc('nba__opp_free_throw_rate') }}"
      - name: rebound_pct
        description: "{{ doc('nba__rebound_pct') }} Team rebounds over team plus opponent rebounds."
      - name: three_point_attempt_rate
        description: "{{ doc('nba__three_point_attempt_rate') }}"
      - name: assist_pct
        description: "{{ doc('nba__assist_pct__team') }}"
      - name: true_shooting_pct
        description: "{{ doc('nba__true_shooting_pct') }}"
      - name: counts_source
        description: "{{ doc('nba__counts_source') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["team_box", "player_sum", "none"]
      - name: has_full_box
        description: "{{ doc('nba__has_full_box') }}"
        tests:
          - not_null
      - name: formula_version
        description: "{{ doc('nba__formula_version') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per (game_id, team_id)
        purpose: Team-game box counts and efficiency, the per-game building block for team ratings.
        business_question: How efficiently did a team play in a given game, on offence and defence?
        seasonality: Scores from 1946-47; ratings from 1973-74 (complete from 1983-84).
        relationships:
          decomposes_into:
            - "int_nba_team_games: counts and possessions"
          correlates_with:
            - "nba_game_results: the same games, one row per game"
            - "nba_team_advanced_profile: the same metrics from season totals"

  - name: nba_league_season_baselines
    description: >
      One row per season per game type: league totals and league-average rates,
      the baseline relative and era-adjusted NBA metrics compare against. Rates
      come from the summed numerators and denominators of every team game, never
      from averaged team rates. A league total is null unless every team game
      recorded that count; rates use the team games that recorded their inputs,
      and team_games_with_counts / team_games_with_full_box give the samples.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_start_year
              - game_type
    columns:
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: season_label
        description: "{{ doc('nba__season_label') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Regular Season", "Play-in Tournament", "Playoffs", "NBA Cup Final"]
      - name: team_games
        description: Team games played (two per game).
        tests:
          - not_null
      - name: team_games_with_counts
        description: Team games with box counts; the sample for the shooting rates.
      - name: team_games_with_full_box
        description: Team games from 1973-74 with a full box on both sides; the sample for possessions, ratings, pace, turnover and rebound rates.
      - name: lg_points
        description: League total points; null unless every team game recorded it.
      - name: lg_field_goals_made
        description: League total field goals made; null unless every team game recorded it.
      - name: lg_field_goals_attempted
        description: League total field goals attempted; null unless every team game recorded it.
      - name: lg_three_pointers_made
        description: League total three pointers made; null unless every team game recorded it.
      - name: lg_three_pointers_attempted
        description: League total three pointers attempted; null unless every team game recorded it.
      - name: lg_free_throws_made
        description: League total free throws made; null unless every team game recorded it.
      - name: lg_free_throws_attempted
        description: League total free throws attempted; null unless every team game recorded it.
      - name: lg_rebounds_offensive
        description: League total rebounds offensive; null unless every team game recorded it.
      - name: lg_rebounds_defensive
        description: League total rebounds defensive; null unless every team game recorded it.
      - name: lg_rebounds_total
        description: League total rebounds total; null unless every team game recorded it.
      - name: lg_assists
        description: League total assists; null unless every team game recorded it.
      - name: lg_steals
        description: League total steals; null unless every team game recorded it.
      - name: lg_blocks
        description: League total blocks; null unless every team game recorded it.
      - name: lg_turnovers
        description: League total turnovers; null unless every team game recorded it.
      - name: lg_fouls_personal
        description: League total fouls personal; null unless every team game recorded it.
      - name: lg_team_minutes
        description: League total team minutes; null unless every team game recorded it.
      - name: lg_possessions
        description: League possessions, estimated from the season's summed counts; null unless every team game had a full box.
      - name: lg_points_per_game
        description: Points per team game, over every team game.
      - name: lg_pace
        description: League pace (possessions per 48 minutes) over team_games_with_full_box.
      - name: lg_points_per_possession
        description: League points per possession over team_games_with_full_box.
      - name: lg_offensive_rating
        description: League points per 100 possessions over team_games_with_full_box; also the league defensive rating.
      - name: lg_true_shooting_pct
        description: League true shooting percentage over team_games_with_counts.
      - name: lg_effective_field_goal_pct
        description: League effective field goal percentage over team_games_with_counts.
      - name: lg_three_point_attempt_rate
        description: League 3PA / FGA over team_games_with_counts; null before 1979-80.
      - name: lg_free_throw_rate
        description: League FT / FGA over team_games_with_counts.
      - name: lg_turnover_pct
        description: League turnovers per play over team_games_with_full_box.
      - name: lg_offensive_rebound_pct
        description: League offensive rebound share over team_games_with_full_box.
      - name: formula_version
        description: "{{ doc('nba__formula_version') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per (season_start_year, game_type)
        purpose: League totals and averages that relative, era-adjusted and all-in-one metrics use as their baseline.
        business_question: What was league-average efficiency, pace and shot profile in a given season?
        seasonality: Shooting from 1946-47 (partial before ~1965); possession metrics from 1973-74, complete from 1983-84.
        relationships:
          decomposes_into:
            - "int_nba_team_games: summed per season and game type"

  - name: nba_team_form
    description: >
      One row per team per competitive game from 1973-74: the team's form going
      into that game, from games played before it only (the game itself never
      counts). Last-10, last-20 and season-to-date net rating from summed points
      and possessions within the same season and game type, next to the
      league's offensive rating and pace on earlier dates of that season and
      game type. *_games columns give each window's sample size; windows skip
      games without a full box.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - team_id
    columns:
      - name: team_id
        description: "{{ doc('nba__team_id') }}"
        tests:
          - not_null
      - name: game_id
        description: "{{ doc('nba__game_id') }}"
        tests:
          - not_null
      - name: season_start_year
        description: "{{ doc('nba__season_start_year') }}"
        tests:
          - not_null
      - name: game_type
        description: "{{ doc('nba__game_type') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Regular Season", "Play-in Tournament", "Playoffs", "NBA Cup Final"]
      - name: game_date
        description: "{{ doc('nba__game_date') }} The as-of date: values use games before it."
      - name: last_10_games
        description: Games with a full box among the team's previous 10 games this season and game type.
      - name: last_10_net_rating
        description: Net rating over the previous 10 games (summed points and possessions).
      - name: last_20_games
        description: Games with a full box among the team's previous 20 games this season and game type.
      - name: last_20_net_rating
        description: Net rating over the previous 20 games (summed points and possessions).
      - name: season_to_date_games
        description: Games with a full box the team played earlier this season and game type.
      - name: season_to_date_net_rating
        description: Net rating over every earlier game this season and game type.
      - name: league_to_date_offensive_rating
        description: League points per 100 possessions on earlier dates of this season and game type.
      - name: league_to_date_pace
        description: League pace on earlier dates of this season and game type.
      - name: formula_version
        description: "{{ doc('nba__formula_version') }}"
        tests:
          - not_null

    config:
      meta:
        grain: one row per (game_id, team_id)
        purpose: As-of team form for comparing a team's recent level with the league so far.
        business_question: How well was a team playing going into a given game?
        seasonality: 1973-74 onward; the first game of each season and game type has no form.
        relationships:
          decomposes_into:
            - "int_nba_team_games: windows over earlier games"

  - name: nba_player_stint_advanced
    description: >
      One row per player per team per season per game type (a stint; a player
      traded mid-season has one row per team): box-score advanced metrics from
      the player's games for that team. Shooting efficiency (TS%, eFG%, 3PA and
      FT rates, TS points added), usage, assist, turnover, rebound, steal and
      block percentages with team context from the same games, per-100
      production, Game Score and Dean Oliver's individual offensive and
      defensive ratings. Every rate is computed from summed numerators and
      opportunities (macros/nba_player_metric_columns.sql); each is null before
      its coverage start and where inputs were not recorded. Rates are 0-1.
      nba_player_season_advanced combines a traded player's stints.
    tests:
      - dbt_utils.unique_combination_of_columns:

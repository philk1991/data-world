version: 2

sources:
  - name: raw_payments
    database: payments_raw
    schema: raw_payments
    tables:
      - name: raw_requests
        description: >
          Raw payment request events consumed from the 'payments.requests' Kafka
          topic. One row per payment attempt (payment_id, amount, requested_at).
          Append-only — at-least-once delivery means payment_id may repeat, we
          take the first based on immutable assumption.
        # Ingestion-health monitoring on the load timestamp (consumed_at): warns
        # when new data stops arriving (consumer or Kafka down). Check with
        # `task dbt:freshness`. (Replaced Elementary's freshness/volume anomaly
        # tests when Elementary was removed for the dbt v2 upgrade.)
        config:
          loaded_at_field: consumed_at
          freshness:
            warn_after: {count: 1, period: hour}
      - name: raw_rejections
        description: >
          Raw payment rejection events consumed from the 'payments.rejected' Kafka
          topic. One row per rejected payment (payment_id, rejected_at). Arrives up
          to 10 minutes after the matching request. Append-only.
        # Same freshness monitoring as raw_requests. A stalled rejection feed is
        # easy to miss, since it just looks like fewer rejections.
        config:
          loaded_at_field: consumed_at
          freshness:
            warn_after: {count: 1, period: hour}
